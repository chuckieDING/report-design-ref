<style>
/* tokens.css — 设计令牌契约。后续所有任务只许引用这里定义的变量名。
   色板已用 validate_palette.py 实测校验：
     - 文本/背景组合满足 WCAG AA（正文 4.5:1，大字与非文本 UI 3:1）
     - 六个图表序列色两两满足 ΔE(OKLab) 正常视觉 >=15、色觉障碍模拟(protan/deutan/tritan) >=6
   详见仓库根目录 palette.md 的实测记录。

   --color-primary/success/warning/danger 四个 token 只承担「填充/边框/图表」这一种用途
   （门槛 3:1）——按钮底色、卡片 hover 边框、图表系列色都直接用它们，不能为了小字可读性
   把它们整体加深，否则所有这些场景都会被拖暗。
   凡是「浅底徽标/提示条背景」与「贴在浅底或 surface 上的小字」（如 .ds-badge、
   .ds-stat-delta）两种更高门槛的用途，改用下面新增的 *-tint（非文本门槛）与
   *-ink（>=4.5，success/danger 的 ink 额外要求在 surface 上也 >=4.5）。 */

:root {
  --color-primary: #2563eb;
  --color-primary-light: #3b82f6;
  --color-primary-dark: #1d4ed8;
  --color-accent: #7c3aed;
  --color-success: #059669;
  --color-warning: #d97706;      /* 实测 on #ffffff = 3.19，已达 AA_LARGE(3.0)，填充/边框/图表用途无需加深；
                                     小字场景(badge/stat-delta)改用 --color-warning-ink，见下 */
  --color-danger: #dc2626;
  --color-surface: #ffffff;
  --color-surface-alt: #f8fafc;
  --color-surface-hover: #f1f5f9;
  --color-border: #e2e8f0;

  /* 浅底徽标/提示条背景：原色以 12% 不透明度叠在 --color-surface(#ffffff) 上的合成结果，
     写死成静态 hex（不用 rgba，避免和未来改动的基色失同步，也方便 validate_palette.py 直接读取）。
     非文本背景色，没有独立的对比度门槛。 */
  --color-primary-tint: #e5ecfd;
  --color-success-tint: #e1f2ed;
  --color-warning-tint: #faefe1;
  --color-danger-tint: #fbe5e5;

  /* 浅底徽标文字 / .ds-stat-delta 等小字专用：同色相、只压明度，
     要求 on 对应 -tint >= 4.5；success/danger 额外要求 on --color-surface 也 >= 4.5
     （.ds-stat-delta 直接贴 surface）。实测见 palette.md。 */
  --color-primary-ink: #1d4ed8;
  --color-success-ink: #047857;
  --color-warning-ink: #9f5704;  /* 2026-10-14 审查：原 #92400e on tint 实测 6.25，比同排 primary(5.66)/
                                     success(4.73)/danger(5.37) 明显偏棕、视觉不一致；改用 #9f5704
                                     （on tint 4.82，margin 0.32），同色相(amber)仅调回与其余三色同量级 */
  --color-danger-ink: #b91c1c;
  --color-text: #1e293b;
  --color-text-secondary: #64748b;
  --color-text-muted: #62738f;   /* 自 #94a3b8 加深：原值 on #ffffff = 2.56，远低于 AA_NORMAL(4.5)。
                                     同色相(slate)逐级插值找到的最接近原值且 >=4.5 的档位，实测 4.81 */
  /* 2026-10-14 审查（Review D5）：--color-border（#e2e8f0）on --color-surface
     仅 1.23:1，远低于 WCAG 1.4.11 对非文本 UI 边界的 3:1 门槛——.ds-btn.secondary
     （背景与所在卡片同色，唯一视觉边界就是这条边框）和 .ds-dropzone 的虚线边框
     都靠它才能被辨认出轮廓。新增这个专用 token 而不是直接改深 --color-border
     本身：它还用在表格分隔线、卡片/导航边框等纯装饰场景，那些地方 3:1 不是
     必需、改深了反而显得过重。直接复用已验算过的 --color-text-muted 同色值
     （4.81，远超 3:1 门槛），不再新调一个未经验证的颜色。 */
  --color-border-strong: #62738f;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.06);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);

  /* 图表专用：栅格线/坐标轴为装饰与刻度文本 */
  --chart-grid: #e2e8f0;
  --chart-axis: #62738f;         /* 原值 #94a3b8 同样只有 2.56，刻度数字是真文本，按 AA_NORMAL 一并修正 */

  /* 六条分类序列色：浅/深主题刻意使用同一组色值（见 palette.md 的取舍说明），
     角色固定为 s1 主色系 / s2 暖色 / s3 绿 / s4 琥珀 / s5 紫 / s6 青。
     已用 delta_e() 验算全部 15 组两两组合，正常视觉与三种色觉障碍模拟均达标。 */
  --chart-s1: #0072b2;
  --chart-s2: #d55e00;
  --chart-s3: #009e73;
  --chart-s4: #eab308;
  --chart-s5: #a855f7;
  --chart-s6: #56b4e9;
}

[data-theme="dark"] {
  --color-primary: #818cf8;
  --color-primary-light: #a5b4fc;
  --color-primary-dark: #6366f1;
  --color-accent: #c084fc;
  --color-success: #4ade80;
  --color-warning: #fbbf24;
  --color-danger: #f87171;
  --color-surface: #18181b;
  --color-surface-alt: #09090b;
  --color-surface-hover: #27272a;
  --color-border: #3f3f46;

  /* 浅底徽标/提示条背景（深色主题里其实是「稍微提亮的深底」）：
     原色以 12% 不透明度叠在 --color-surface(#18181b) 上的合成结果，静态 hex。 */
  --color-primary-tint: #252636;
  --color-success-tint: #1e3027;
  --color-warning-tint: #332c1c;
  --color-danger-tint: #332325;

  /* 深色主题四个基色本身 on 对应 tint（以及 success/danger on surface）实测已经 >= 4.5，
     无需额外加深，ink 直接复用基色值（同色相、同明度）。 */
  --color-primary-ink: #818cf8;
  --color-success-ink: #4ade80;
  --color-warning-ink: #fbbf24;
  --color-danger-ink: #f87171;
  --color-text: #fafafa;
  --color-text-secondary: #d4d4d8;
  --color-text-muted: #a1a1aa;
  /* 同上（Review D5）：深色下 --color-border（#3f3f46）on --color-surface
     仅 1.70:1，同样复用已验算过的 --color-text-muted 同色值（6.91）。 */
  --color-border-strong: #a1a1aa;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -2px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.6), 0 4px 6px -4px rgba(0,0,0,0.4);
  --shadow-xl: 0 20px 40px -5px rgba(0,0,0,0.7), 0 8px 16px -6px rgba(0,0,0,0.5);

  --chart-grid: #27272a;
  --chart-axis: #a1a1aa;         /* 原值 #52525b on #18181b 仅 2.29，改用深色 text-muted 同值，实测 6.91 */

  /* 分类序列色与浅色主题相同（见 palette.md）：曾尝试整体提亮成 400 色阶的柔和版本，
     但多组 ΔE 在色觉障碍模拟下塌缩（如 s1-s6<7、s3-s6<5），故保留同一组已验算通过的色值。
     on 深色背景 (#18181b) 的非文本对比度实测 3.42–9.24，均 >= 3:1。 */
  --chart-s1: #0072b2;
  --chart-s2: #d55e00;
  --chart-s3: #009e73;
  --chart-s4: #eab308;
  --chart-s5: #a855f7;
  --chart-s6: #56b4e9;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--color-surface-alt);
  color: var(--color-text);
  font: 400 14px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* components.css — 视觉组件层。颜色一律走 src/tokens.css 的变量，
   不得出现硬编码颜色字面量（#xxx / rgba(...)）。
   仅两处例外：.ds-btn.primary 的 color:#fff（白字压主色按钮，已验达标）
   与模态遮罩 rgba(0,0,0,.45)（纯黑半透明，与主题无关）。 */

/* ---------- 布局 ---------- */
.ds-wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }
.ds-grid { display: grid; gap: 14px; }
.ds-grid-2 { grid-template-columns: 1fr 1fr; }
.ds-grid-4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
@media (max-width: 900px) { .ds-grid-2 { grid-template-columns: 1fr; } }

/* ---------- 顶栏与标签页 ---------- */
.ds-nav {
  display: flex; align-items: center; gap: 20px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding: 0 20px; position: sticky; top: 0; z-index: 50;
}
.ds-nav-title { font-size: 16px; font-weight: 600; padding: 14px 0; color: var(--color-text); }
.ds-tabs { display: flex; gap: 4px; }
.ds-tab {
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--color-text-secondary); font: inherit; font-size: 13px;
  padding: 14px 12px; cursor: pointer; transition: color var(--transition);
}
.ds-tab:hover { color: var(--color-text); }
.ds-tab[aria-selected="true"] { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }
.ds-panel[hidden] { display: none; }

/* ---------- 卡片与 KPI ---------- */
.ds-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.ds-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
.ds-card-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--color-text); }
.ds-stat { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 18px; }
.ds-stat-label { font-size: 12px; color: var(--color-text-muted); display: flex; align-items: center; gap: 4px; }
.ds-stat-value { font-size: 26px; font-weight: 600; margin-top: 6px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ds-stat-delta { font-size: 12px; margin-top: 4px; color: var(--color-text-secondary); }
/* 12px 常规文字贴在卡片底上，4.5:1 门槛：必须用 -ink，不能用填充/图表用途的基色 */
.ds-stat-delta.up { color: var(--color-success-ink); }
.ds-stat-delta.down { color: var(--color-danger-ink); }

/* ---------- 数据表 ---------- */
.ds-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ds-table th {
  background: var(--color-surface-alt); color: var(--color-text-secondary);
  font-weight: 600; text-align: left; padding: 9px 12px;
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap;
}
.ds-table th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
.ds-table th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
.ds-table td { padding: 9px 12px; border-bottom: 1px solid var(--color-border); }
.ds-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.ds-table tbody tr:hover { background: var(--color-surface-hover); }

/* ---------- 徽标与按钮 ---------- */
.ds-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
/* 徽标背景用 -tint（静态 hex，非文本门槛），文字用 -ink（已验 on 对应 tint >= 4.5） */
.ds-badge.blue  { background: var(--color-primary-tint); color: var(--color-primary-ink); }
.ds-badge.green { background: var(--color-success-tint); color: var(--color-success-ink); }
.ds-badge.amber { background: var(--color-warning-tint); color: var(--color-warning-ink); }
.ds-badge.red   { background: var(--color-danger-tint);  color: var(--color-danger-ink); }
.ds-btn {
  font: inherit; font-size: 13px; padding: 7px 14px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer; transition: background var(--transition), border-color var(--transition);
}
.ds-btn.primary { background: var(--color-primary); color: #fff; }
.ds-btn.primary:hover { background: var(--color-primary-dark); }
/* 边框是这个按钮唯一的视觉边界（背景与所在卡片同色），用 --color-border-strong
   而不是 --color-border——后者 on --color-surface 只有 1.23:1(浅)/1.70:1(深)，
   达不到 WCAG 1.4.11 对非文本 UI 边界的 3:1（Review D5）。 */
.ds-btn.secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
.ds-btn.secondary:hover { background: var(--color-surface-hover); border-color: var(--color-primary); }
.ds-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ---------- 提示条 ---------- */
/* 背景用对应的 -tint，边框用对应基色（非文本 UI，3:1 足够），文字保持 --color-text */
.ds-banner { padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.55; border: 1px solid var(--color-border); background: var(--color-surface-alt); color: var(--color-text); }
.ds-banner.ok { border-color: var(--color-success); border-style: dashed; background: transparent; color: var(--color-text-muted); padding: 6px 14px; font-size: 12px; }
.ds-banner.warn { border-color: var(--color-warning); background: var(--color-warning-tint); color: var(--color-text); }
.ds-banner.bad { border-color: var(--color-danger); background: var(--color-danger-tint); color: var(--color-text); }
.ds-banner.info { border-color: var(--color-primary); background: var(--color-primary-tint); color: var(--color-text); }

/* ---------- 模态与上传区 ---------- */
.ds-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.ds-modal-backdrop[hidden] { display: none; }
.ds-modal { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); max-width: 90vw; max-height: 88vh; overflow: auto; padding: 20px; }
/* 同上（Review D5）：虚线边框是这个区域唯一的可识别轮廓，用 --color-border-strong。 */
.ds-dropzone { border: 2px dashed var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-surface); padding: 32px; text-align: center; color: var(--color-text-secondary); transition: border-color var(--transition); }
.ds-dropzone.dragover { border-color: var(--color-primary); background: var(--color-surface-hover); }

/* ---------- toast ---------- */
.ds-toast-host { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.ds-toast { background: var(--color-surface); border: 1px solid var(--color-border); border-left: 3px solid var(--color-primary); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 10px 14px; font-size: 13px; }

/* ---------- 图表容器与空态 ---------- */
.ds-chart-host { position: relative; height: 260px; }
/* 空数据态只放一行提示文字，不需要和真实图表一样高的画布——沿用整卡
   260px 高在交付页上会留出大片空白。单独给这种"确定不会画图"的宿主
   一个矮一截的变体，内容（.ds-chart-empty）仍然用 position:absolute
   居中撑满，不用动。 */
.ds-chart-host--compact { height: 90px; }
.ds-chart-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted); font-size: 13px;
  border: 1px dashed var(--color-border); border-radius: var(--radius-md);
}

/* ---------- 图表缩放工具条（Task 6） ---------- */
.ds-chart-toolbar {
  position: absolute; top: 4px; right: 6px;
  display: flex; align-items: center; gap: 2px; z-index: 5;
}
.ds-chart-btn {
  width: 22px; height: 22px; line-height: 1; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--color-surface); color: var(--color-text-secondary);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  font: inherit; font-size: 12px; cursor: pointer;
}
.ds-chart-btn:hover { color: var(--color-primary); border-color: var(--color-primary); }
.ds-chart-btn svg { display: block; }
.ds-chart-hint { font-size: 10px; color: var(--color-text-muted); margin-left: 4px; white-space: nowrap; }
.ds-chart-host.ds-chart-fullscreen {
  position: fixed; inset: 24px; height: auto; z-index: 150;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-xl);
}

/* ---------- 特型图：甘特 / 热力（Task 7，手写 SVG） ---------- */
/* 字体/颜色都和 Chart.js 图表共用同一套 token：字体走 --font-sans，颜色
   由 charts-svg.js 从 DS.charts.themeColors() 取值后以 SVG 属性写在元素上，
   这里只负责排版层面的东西（不引入任何颜色字面量）。 */
.ds-svg-chart { display: block; font-family: var(--font-sans); max-width: 100%; }
.ds-svg-chart text { user-select: none; }

</style>
</head>

<script>/* interactions.js —— DS 交互层：主题、标签页、表格排序、模态、toast。
   注意：本机 headless chromium 的 requestAnimationFrame 回调永不触发
   （该渲染模式不产生合成帧），本文件一律不使用 rAF 做任何延迟/动画驱动。 */
window.DS = window.DS || {};

(function (DS) {
  'use strict';

  var STORAGE_KEY = 'ds-theme';

  /* localStorage 在隐私模式、部分浏览器的 file:// 协议下会抛 SecurityError
     （本仓库用 ?nostorage=1 测试钩子在 demo 页模拟这一行为，见 demo/index.html）。
     整个主题模块必须在无持久化的情况下照常工作，只是记不住选择。 */
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
  }

  DS.theme = {
    get: function () {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    },
    set: function (mode) {
      var next = mode === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      storageSet(STORAGE_KEY, next);
      document.dispatchEvent(new CustomEvent('ds:themechange', { detail: { mode: next } }));
    },
    toggle: function () { DS.theme.set(DS.theme.get() === 'dark' ? 'light' : 'dark'); },
    init: function () {
      var saved = storageGet(STORAGE_KEY);
      if (saved !== 'dark' && saved !== 'light') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved);
    }
  };

  DS.tabs = {
    init: function (rootSelector) {
      var root = document.querySelector(rootSelector);
      if (!root) return;
      /* 幂等保护防的是"对同一个 root 元素重复挂监听器"，不是"这组 tabs
         一辈子只能绑一次"。监听器挂在事件委托的容器（root 本身）上，
         root.innerHTML = 新内容 不会移除挂在 root 自身上的监听器，重渲染
         之后不需要、也不会因为这条保护被拒绝而失效。 */
      if (root.dataset.dsTabsBound === '1') return;
      root.dataset.dsTabsBound = '1';
      root.addEventListener('click', function (ev) {
        var tab = ev.target.closest('.ds-tab');
        if (!tab || !root.contains(tab)) return;
        var target = tab.getAttribute('data-panel');
        root.querySelectorAll('.ds-tab').forEach(function (t) {
          t.setAttribute('aria-selected', String(t === tab));
        });
        /* 面板查询收敛到"这组 tabs 自己声明过的" data-panel 目标，不是
           document.querySelectorAll('.ds-panel') 的全文档扫描——否则页面上
           并存第二组独立 tabs 时，点 g2 的某个 tab 会把 g1 当前显示的面板
           也隐藏掉（Review B2）。面板通常是 root 的兄弟节点、不在 root
           内部，所以这里从 root 内所有 .ds-tab[data-panel] 收集这组 tabs
           自己名下的面板 id 全集，再按 id 去文档里找。每次点击都重新收集，
           不缓存成闭包变量——tabs 被重渲染、动态增删标签页之后也能跟着变
           （与 DS.tables.sortable 的委托思路一致，Review B1）。 */
        var panelIds = Array.prototype.map.call(
          root.querySelectorAll('.ds-tab[data-panel]'),
          function (t) { return t.getAttribute('data-panel'); }
        );
        panelIds.forEach(function (id) {
          var p = document.getElementById(id);
          if (p) p.hidden = (id !== target);
        });
      });
    }
  };

  // Review D3：报表里常见的"数值但不是裸数字字面量"的格式——千分位逗号
  // （1,234）、百分号（5%）、常见时长单位（3.5h / 12h，min/s 同理）、
  // hh:mm 或 m:ss 式的时长（02:14）。原来整列判定走 isFinite()，这些格式
  // 全部被判成非数字，整列退化成字典序，且是静默的（无报错、无警告），
  // 与 README 明确承诺的"数字列按数值"相悖。这里保守剥离这几种——不做
  // 通用单位剥离（任意后缀都摘掉风险太高，容易把本来就是文本的列，比如
  // 型号"3.5mm"，误判成数字列）。
  var TIME_COLON_RE = /^(\d{1,3}):([0-5]\d)$/;

  function parseSortableNumber(raw) {
    var t = TIME_COLON_RE.exec(raw);
    if (t) return parseInt(t[1], 10) * 60 + parseInt(t[2], 10);
    var stripped = raw.replace(/,/g, '').replace(/%$/, '').replace(/(h|min|s)$/i, '');
    return stripped !== '' && isFinite(stripped) ? parseFloat(stripped) : NaN;
  }

  DS.tables = {
    sortable: function (tableSelector) {
      var table = document.querySelector(tableSelector);
      if (!table) return;
      /* 幂等保护防的是"对同一张 <table> 重复挂监听器"（重复会叠加监听器，
         导致一次点击触发两次排序回调，"升序点击"实际落到降序结果），不是
         "这张表一辈子只能排一次序"。此前的实现把监听器逐个挂在每个 <th>
         上，table.innerHTML = 新 thead+tbody 会把这些 <th> 连同监听器一起
         扔掉，新 <th> 上什么都没挂——消费者重渲染表格后再调一次 sortable()
         会被这条幂等保护直接拒绝，点击新表头毫无反应、无报错（Review
         B1）。改成委托在 table 本身（不会被 innerHTML 替换掉）上监听
         click，th/tbody 都在点击时动态查找当前 DOM，而不是绑定时捕获的
         闭包，往后无论表格重渲染多少次都不需要特殊处理。 */
      if (table.dataset.dsSortableBound === '1') return;
      table.dataset.dsSortableBound = '1';
      table.addEventListener('click', function (ev) {
        var th = ev.target.closest('th');
        if (!th || !table.contains(th)) return;
        var tbody = table.tBodies[0];
        if (!tbody) return;
        var index = Array.prototype.indexOf.call(th.parentNode.children, th);

        var asc = th.getAttribute('aria-sort') !== 'ascending';
        table.querySelectorAll('th').forEach(function (o) { o.removeAttribute('aria-sort'); });
        th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');

        var rows = Array.prototype.slice.call(tbody.rows);
        function cellText(r) { return r.cells[index].textContent.trim(); }

        /* 按列统一判定，不逐对判定：Array.prototype.sort 的比较器必须满足传递律。
           逐对判断"这一对是不是都能转数字"在混了文本/空值的列上不满足传递性
           （例如 5 / '' / 北京 三者两两比较的"both"结果互不一致），排序结果在
           规范上是未定义的。当且仅当该列全部非空单元格都能解析为数字时，整列
           才按数值排序；否则整列按字符串排序。 */
        var columnIsNumeric = rows.every(function (r) {
          var t = cellText(r);
          return t === '' || !isNaN(parseSortableNumber(t));
        });

        rows.sort(function (a, b) {
          var x = cellText(a), y = cellText(b);
          if (columnIsNumeric) {
            var xEmpty = x === '', yEmpty = y === '';
            if (xEmpty && yEmpty) return 0;
            if (xEmpty) return 1;   // 空单元格无条件排在末尾，升/降序都一样
            if (yEmpty) return -1;
            var cmp = parseSortableNumber(x) - parseSortableNumber(y);
            return asc ? cmp : -cmp;
          }
          var cmp2 = x.localeCompare(y, 'zh-Hans-CN');
          return asc ? cmp2 : -cmp2;
        });
        rows.forEach(function (r) { tbody.appendChild(r); });
      });
    }
  };

  // Esc 监听器挂在 document 上，必须只注册一次，且不能跟 backdrop 的存续
  // 绑在一起判断：document 是永不被替换的稳定对象，"backdrop 不存在就加
  // 一个"这条判据在宿主应用整体重渲染 body、把 backdrop 删掉之后会重新
  // 为真，下次 open() 就会再加一个，且没有上限——close() 本身幂等所以
  // 当前不会有可见症状（Esc 一次触发多次 close() 看不出区别），但监听器
  // 会在 document 上无限累积，是真实的内存泄漏（Review B3）。改用独立的
  // 一次性标志，跟 backdrop 的生命周期彻底解耦。

  DS.modal = {
    open: function (innerHTML) {
      var back = document.querySelector('.ds-modal-backdrop');
      if (!back) {
        back = document.createElement('div');
        back.className = 'ds-modal-backdrop';
        back.innerHTML = '<div class="ds-modal"></div>';
        document.body.appendChild(back);
        back.addEventListener('click', function (ev) {
          if (ev.target === back) DS.modal.close();
        });
      }
      if (!modalEscBound) {
        modalEscBound = true;
        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') DS.modal.close();
        });
      }
      back.querySelector('.ds-modal').innerHTML = innerHTML;
      back.hidden = false;
    },
    close: function () {
      var back = document.querySelector('.ds-modal-backdrop');
      if (back) back.hidden = true;
    }
  };

  DS.toast = {
    show: function (msg, ms) {
      var host = document.querySelector('.ds-toast-host');
      if (!host) {
        host = document.createElement('div');
        host.className = 'ds-toast-host';
        document.body.appendChild(host);
      }

      el.className = 'ds-toast';
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(function () { el.remove(); }, ms || 3000);

</script>
<script>/* charts.js —— DS 图表层：token 注入、空态、主题联动、长标签截断。
   滚轮缩放与工具条在 Task 6 追加。

   关于动画：本机 headless chromium 的 requestAnimationFrame 回调永不触发，
   Chart.js 默认动画器依赖 rAF，一旦开启动画，首次绘制的完成回调永远不会发生。
   因此这里做双保险禁用：init() 里关一次全局默认值，paint() 里对每个传入的
   config 再关一次 —— paint() 必然在 create() 内被调用，即使调用方忘了先跑

  // 的图表类型，默认按笛卡尔处理——渲染上色块/轴线不对会立刻看得见，比"静默
  // 少一套主题色"更容易被发现。
  var NON_CARTESIAN_TYPES = ['pie', 'doughnut', 'polarArea', 'radar'];
  // 弧形族：每个数据点一个扇区，需要颜色数组而不是单一颜色。
  var ARC_TYPES = ['pie', 'doughnut', 'polarArea'];

  function isCartesian(type) { return NON_CARTESIAN_TYPES.indexOf(type) === -1; }
  function isArc(type) { return ARC_TYPES.indexOf(type) !== -1; }

  // 类目轴判定：indexAxis:'y' 的横向条形图里类目在 y 轴、数值在 x 轴；
  // 默认（含 indexAxis 留空）类目在 x 轴。paint() 的长标签截断和下面的
  // 缩放/拖框选必须认同一个轴——此前两处各写了一份判定，缩放那份永远
  // 认 x 轴，横向条形图上点一下工具条就会把数值轴钳成 0..1、柱子冲出
  // 绘图区，是一个会被用户一键触发的 bug（Review C1）。现在统一成这一
  // 个函数，两处都调它。
  function zoomAxisFor(indexAxisValue) {

    init: function (opts) {

      var staleBar = host.querySelector('.ds-chart-toolbar');

      var chart = new Chart(canvas, config);

      // 缩放工具条只挂笛卡尔图——饼图/雷达图没有 x/y 轴，缩放对它们没有意义，
      // 挂上去就是一组无效按钮。非笛卡尔实例不设 chart.$ds，zoom/resetZoom/
      // zoomRange/isZoomed 对它们调用会直接短路返回，不抛错。

          for (var k = 0; k < n; k++) palette.push(c.series[k % c.series.length]);
          if (d.backgroundColor == null || d.__dsAuto) { d.backgroundColor = palette; d.__dsAuto = true; }
          if (d.borderColor == null || d.__dsAuto) { d.borderColor = cssVar('--color-surface'); }
        } else {
          var color = c.series[i % c.series.length];
          if (d.backgroundColor == null || d.__dsAuto) { d.backgroundColor = color; d.__dsAuto = true; }
          if (d.borderColor == null || d.__dsAuto) { d.borderColor = color; }
        }
      });
      return config;
    },

      registry.forEach(function (entry) {

        // ds:themechange 是 CustomEvent，dispatchEvent() 不会把监听器里的异常
        // 传给调用方（DS.theme.set() 照常返回），如果这里不接住，问题会在
        // 控制台和应用层都悄无声息——多图页面上表现为"一半主题切了一半没切"。
        try {
          DS.charts.paint(entry.config);
          entry.chart.update('none');
        } catch (e) {
          var id = entry.chart && entry.chart.canvas && entry.chart.canvas.id;
          console.warn('DS.charts.retheme: 重绘失败，canvas=' + (id || '?'), e);
        }
      });
    },

    /* 已注册的活动实例；destroy() 过的不在其中。 */
    all: function () {
      pruneDestroyed();
      return registry.map(function (entry) { return entry.chart; });
    },

       清理图表时该用的入口。Review I1：摘除前必须先把工具条 DOM 和
       canvas._dsChart 指针一并清掉——chart.destroy() 之后 chart.canvas 会
       被置 null，工具条按钮的 click 闭包却还攥着这个 chart 对象，不清理的

      var canvas = chart.canvas;
      if (canvas) {
        var host = canvas.parentNode;
        if (host) {
          var bar = host.querySelector('.ds-chart-toolbar');
          if (bar) bar.remove();
          // Review C2：全屏模式下销毁必须把 host 的 ds-chart-fullscreen 一并
          // 摘掉。这个 class 是工具条 ⛶ 按钮加在 host 上的（charts.js
          // _mountToolbar），样式是 position:fixed; inset:24px; z-index:150——
          // 上面一行已经把唯一的退出入口（工具条本身）摘掉了，不清这个
          // class 的话，页面上会留下一块盖住整个视口、没有任何关闭途径的
          // 空白面板，只能刷新页面才能恢复（实测路径：放大看图 → 改筛选
          // 条件 → 消费者调用 destroy() 重建）。
          host.classList.remove('ds-chart-fullscreen');

      }
      try { chart.destroy(); } catch (e) { /* 已经销毁过，忽略 */ }

    },

    /* ---------- 缩放：状态按实例隔离，绝不共享模块级游标 ----------
       统一缩放"类目轴"：indexAxis:'y' 的横向条形图里类目在 y 轴，
       zoomAxisFor() 和 paint() 里长标签截断用的是同一个判定（Review C1）。
       没有类目标签的笛卡尔图（scatter / x:linear 这类）没有"索引"概念，
       改按数据域等比例缩放，基准是 create() 时 Chart.js 自动算出的那份
       原始量程（挂在 chart.$ds.natural 上）。 */
    _bounds: function (chart) {
      var axis = zoomAxisFor(chart.options.indexAxis);
      var labels = chart.data.labels;
      if (labels && labels.length) {
        return { axis: axis, lo: 0, hi: Math.max(0, labels.length - 1), indexed: true };
      }
      // 自愈：create() 时如果画布还是 0 尺寸（比如挂在当时隐藏的标签页里），
      // Chart.js 对无类目的线性轴会退回一个占位量程（实测是 0..100），不是
      // 真实数据域，且这份快照此后再也不会自动刷新。只要当前没有处于缩放
      // 状态（视图本就该等于满量程本身），用"活的" scale 量程校正一次——
      // 画布一旦变得可见并真正 resize() 过，chart.scales 就是准的，借这个
      // 机会把 natural 快照修正回真实值，而不是让一次性的创建时快照永远
      // 带着错的占位量程。
      if (chart.$ds && chart.$ds.min == null && chart.$ds.max == null) {
        var live = chart.scales[axis];
        if (live && isFinite(live.min) && isFinite(live.max) && live.max > live.min) {

        }
      }
      var nat = chart.$ds && chart.$ds.natural;
      if (nat && isFinite(nat.min) && isFinite(nat.max) && nat.max > nat.min) {
        return { axis: axis, lo: nat.min, hi: nat.max, indexed: false };
      }
      // 兜底：退回读当前 scale 的量程，好过硬编码的 0..0。
      var sc = chart.scales[axis];
      return { axis: axis, lo: sc.min, hi: sc.max, indexed: false };
    },

    // 缩放/框选允许收到的最窄视图宽度：索引域固定半个索引单位（原语义，
    // 保证至少看得到一个类目）；数据域按满量程的 1% 取相对值，不能再用
    // 固定的 0.5——scatter 的数据域可能是 0..1 也可能是 0..100000。
    _minHalf: function (b) {
      return b.indexed ? 0.5 : Math.max((b.hi - b.lo) * 0.01, 1e-9);
    },

    // 当前"视图"范围：$ds.min/max 为 null 表示还没有显式缩放约束，视图
    // 等于满量程 b.lo/b.hi。
    _viewRange: function (chart, b) {
      var s = chart.$ds;
      return {
        min: s.min != null ? s.min : b.lo,
        max: s.max != null ? s.max : b.hi
      };
    },

    // chart.options 是 Chart.js 的 resolver，但直接写它的叶子属性（如这里的
    // scales[axis].min/max）会真实落回底层、回读也能拿到新值——这一点已经
    // 实测验证过。真正会炸的是把从它身上读出来的子对象再原样赋回同一路径
    // （`o.x = o.x || {}` 这种自赋值），那会在 resolver 内部形成自引用。这里
    // 只做叶子赋值，没有这个问题，不需要绕道 registry 里的 config 引用。
    //
    // $ds.min/max 都是 null 时（resetZoom 之后）直接删掉 scale 上的 min/max
    // 覆盖、交还 Chart.js 自动量程，而不是我们自己写一份算出来的"满量程"——
    // 这样无论之前缩放成什么样，复位永远能恢复到数据的真实全貌（Review
    // C1：旧实现把 labels.length-1 当成横向条形图数值轴的满量程写回去，
    // 复位反而把图冲得更坏，必须刷新页面才能恢复）。
    _apply: function (chart) {
      var s = chart.$ds;
      var axis = zoomAxisFor(chart.options.indexAxis);
      var scale = chart.options.scales[axis];
      if (s.min == null && s.max == null) {
        delete scale.min;
        delete scale.max;
      } else {
        scale.min = s.min;
        scale.max = s.max;
      }
      chart.update('none');
    },

    zoom: function (chart, factor) {
      if (!chart || !chart.canvas || !chart.$ds) return;
      var b = DS.charts._bounds(chart);
      var v = DS.charts._viewRange(chart, b);
      var mid = (v.min + v.max) / 2;
      var half = Math.max(DS.charts._minHalf(b), (v.max - v.min) / 2 / factor);
      var min = Math.max(b.lo, mid - half);
      var max = Math.min(b.hi, mid + half);
      // 向外缩到覆盖满量程时，把 $ds.min/max 收回 null（视为"未缩放"），
      // 不能让它们停在等于 b.lo/b.hi 的具体数值上——isZoomed() 判定的是
      // "min/max 是否非 null"，钳成具体数值会让它恒为 true。smart 滚轮
      // 模式判断"是否已到缩放下限、该放行翻页"就是靠 isZoomed()，一旦
      // 卡在恒真，用户在这张图上向外滚多少次都无法把滚轮还给页面滚动
      // （Review C1：实测向内滚 2 次、向外滚 25 次，$ds 已是满量程
      // {min:0,max:5} 但 isZoomed() 依然为 true）。resetZoom() 复位同样
      // 置 null，这里让"滚到底"和"点复位"落到同一个状态，而不是两套
      // 表面等价、实际不等价的"满量程"表示。
      if (min <= b.lo && max >= b.hi) {
        chart.$ds.min = null;
        chart.$ds.max = null;
      } else {
        chart.$ds.min = min;
        chart.$ds.max = max;
      }
      DS.charts._apply(chart);
    },

    zoomRange: function (chart, i0, i1) {
      if (!chart || !chart.canvas || !chart.$ds) return;
      var b = DS.charts._bounds(chart);
      var lo = Math.max(b.lo, Math.min(i0, i1));
      var hi = Math.min(b.hi, Math.max(i0, i1));
      // 框选过窄视为误触，忽略——"过窄"按满量程的比例判定，而且是在钳位
      // 到数据边界*之后*判定：从画布外往里拖、或者只有钳位后的那一小段
      // 落在数据范围内，也要能被这条逻辑挡住，不是只挡"两点本来就离得近"
      // 这一种情形。
      if (hi - lo < DS.charts._minHalf(b)) return;
      chart.$ds.min = lo;
      chart.$ds.max = hi;
      DS.charts._apply(chart);
    },

    resetZoom: function (chart) {
      if (!chart || !chart.canvas || !chart.$ds) return;
      chart.$ds.min = null;
      chart.$ds.max = null;
      DS.charts._apply(chart);
    },

    isZoomed: function (chart) {
      if (!chart || !chart.canvas || !chart.$ds) return false;
      return chart.$ds.min != null || chart.$ds.max != null;
    },

    /* 对所有已存在的笛卡尔实例立即生效，无需重建；非笛卡尔实例没有 $ds，
       原样跳过。demo 页的滚轮模式选择器就靠这个方法。未知模式一律拒绝、
       保留原模式——调用方是外部 API 消费者，传错字符串不该静默落到某个
       分支的兜底行为上（Review M6：此前无效字符串会落到和 'zoom' 一样
       的行为，且提示文案变成空字符串，用户毫无察觉）。 */
    setWheelMode: function (mode) {
      if (WHEEL_MODES.indexOf(mode) === -1) {
        console.warn('DS.charts.setWheelMode: 未知模式 "' + mode + '"，已忽略，仍保持 "' + options.wheel + '"');
        return;
      }
      options.wheel = mode;
      pruneDestroyed();
      registry.forEach(function (entry) {
        if (entry.chart.$ds) {
          entry.chart.$ds.mode = mode;
          DS.charts._syncHint(entry.chart);
        }
      });
    },

    /* 滚轮分派：四种模式的唯一分支点。
       page      —— 永不缩放，交给页面滚动
       zoom      —— 直接缩放
       ctrl-zoom —— 按住 Ctrl 才缩放（出厂默认）
       smart     —— 未到极限先缩放，到底后放行翻页 */
    _onWheel: function (chart, ev) {
      if (!chart || !chart.canvas || !chart.$ds) return;
      var mode = chart.$ds.mode || options.wheel;
      if (mode === 'page') return;

      var zoomIn = ev.deltaY < 0;
      if (mode === 'ctrl-zoom' && !ev.ctrlKey) return;
      if (mode === 'smart') {
        var b = DS.charts._bounds(chart);
        var v = DS.charts._viewRange(chart, b);
        var atLimit = zoomIn
          ? (v.max - v.min) / 2 <= DS.charts._minHalf(b)
          : !DS.charts.isZoomed(chart);
        if (atLimit) return;               // 到底了，放行让页面滚动
      }
      ev.preventDefault();
      DS.charts.zoom(chart, zoomIn ? 1.25 : 0.8);
    },

    _mountToolbar: function (chart) {
      var host = chart.canvas.parentNode;
      var bar = document.createElement('div');
      bar.className = 'ds-chart-toolbar';
      // type="button" 防止图表落在 <form> 里时点击触发表单提交
      // （Review M5）；aria-label 补充给屏幕阅读器，title 继续保留给鼠标
      // 悬浮提示。"全屏"用内联 SVG 而不是 U+26F6 字符——审查截图确认过，
      // 本机装了 Noto CJK 字体，这个字形依然渲染成豆腐块，产物又是离线单
      // 文件不内嵌字体，换一台机器更不可控（Review M4）。SVG 用
      // currentColor 继承按钮的文字色，不新增颜色字面量。
      bar.innerHTML =
        '<button type="button" class="ds-chart-btn" data-act="out" title="缩小" aria-label="缩小">−</button>' +
        '<button type="button" class="ds-chart-btn" data-act="in" title="放大" aria-label="放大">+</button>' +
        '<button type="button" class="ds-chart-btn" data-act="reset" title="复位" aria-label="复位">⟲</button>' +
        '<button type="button" class="ds-chart-btn" data-act="full" title="全屏" aria-label="全屏">' +
        '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>' +
        '</button>' +
        '<span class="ds-chart-hint"></span>';
      host.appendChild(bar);
      bar.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('[data-act]') : ev.target;
        var act = btn && btn.getAttribute('data-act');
        if (act === 'in') DS.charts.zoom(chart, 1.25);
        else if (act === 'out') DS.charts.zoom(chart, 0.8);
        else if (act === 'reset') DS.charts.resetZoom(chart);
        else if (act === 'full') host.classList.toggle('ds-chart-fullscreen');
      });
      DS.charts._syncHint(chart);
    },

    /* ctrl-zoom 的可发现性补偿：没有提示用户不会知道要按 Ctrl。非笛卡尔
       图没有 $ds，这里只是安全网——目前唯一调用点（_mountToolbar）只会
       传笛卡尔实例进来，之所以仍然判一下，是因为"安全只是因为当前调用点
       凑巧都满足前提"本身就是一种侥幸，不是真正的保证（Review M8）。 */
    _syncHint: function (chart) {
      if (!chart.$ds) return;
      var hint = chart.canvas.parentNode.querySelector('.ds-chart-hint');
      if (!hint) return;
      var mode = chart.$ds.mode || options.wheel;
      hint.textContent = mode === 'ctrl-zoom' ? 'Ctrl+滚轮缩放'
                       : mode === 'zoom' ? '滚轮缩放'
                       : mode === 'smart' ? '滚轮缩放，到底翻页' : '';
    },

    /* 绑定在 canvas 上、只绑一次（见 create()）；每次都通过 canvas._dsChart
       这个可变指针取"当前"实例，canvas 被二次 create() 复用时天然跟新实例
       走，destroy() 之后这个指针会被清空，idxAt()/mouseup 都要能应付"当前
       没有活实例"这件事而不抛错。拖拽的坐标轴跟 _bounds() 认的是同一个
       zoomAxisFor() 结果：横向条形图（indexAxis:'y'）类目在 y 轴，用户是
       上下拖来框选那几行机台，不是左右拖（Review C1）。"过窄视为误触"统一
       交给 zoomRange() 自己的阈值判断，这里不再重复一份不感知数据域大小
       的固定像素/索引阈值。 */
    _mountDrag: function (canvas) {
      var start = null;
      function idxAt(ev) {
        var chart = canvas._dsChart;
        if (!chart || !chart.canvas) return null;
        var axis = zoomAxisFor(chart.options.indexAxis);
        var rect = canvas.getBoundingClientRect();
        var coord = axis === 'y' ? (ev.clientY - rect.top) : (ev.clientX - rect.left);
        return chart.scales[axis].getValueForPixel(coord);
      }
      canvas.addEventListener('mousedown', function (ev) { start = idxAt(ev); });
      canvas.addEventListener('mouseup', function (ev) {
        if (start == null) return;
        var chart = canvas._dsChart;
        var end = idxAt(ev);
        if (chart && chart.canvas && end != null) DS.charts.zoomRange(chart, start, end);
        start = null;
      });
      canvas.addEventListener('mouseleave', function () { start = null; });
    }
  };
})(window.DS);
</script>
<script>/* charts-svg.js —— Chart.js 画不了的特型图：甘特、热力。

   这两类图没有 Canvas/Chart.js 实例可言，颜色也不像 Chart.js 图表那样能在
   创建时"固化"再靠 retheme() 去改写 config ——这里每次主题切换都是把整块
   SVG 拆掉重画一遍，现读 DS.charts.themeColors() 现画，没有增量更新的概念。

   不使用 requestAnimationFrame：本机 headless chromium 的 rAF 回调永不
   触发（原因见 charts.js 顶部注释），这里完全同步绘制，不依赖它。 */
window.DS = window.DS || {};

(function (DS) {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  // { host: Element, redraw: Function }。按 host 去重而不是无脑 push——
  // 同一个 host 被重新渲染（调用方重建图）时旧条目要被替换掉，否则每次
  // 主题切换都会对着同一个 host 重复画 N 遍，其中 N-1 份还闭包着旧参数。
  var registry = [];

  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    });
    return n;
  }

  function colors() { return DS.charts.themeColors(); }

  // 复用 Chart.js 图表层同一份"长标签截断阈值"配置，不是另起一个魔法数字——
  // 甘特图的机台名称截断规则要和 Task 5 的刻度截断观感一致（同一套 token/
  // 配置来源，不是巧合地凑出同一个数字）。
  function maxLabel() {
    var opts = (DS.charts && DS.charts.options) ? DS.charts.options() : null;
    return (opts && opts.maxLabel) || 10;
  }

  function truncateTo(raw, n) {
    raw = String(raw);
    return raw.length > n ? raw.slice(0, n) + '…' : raw;
  }

  function truncate(raw) {
    return truncateTo(raw, maxLabel());
  }

  // SVG 没有原生 tooltip 机制：全称一律塞进 <title> 子元素，鼠标悬停时
  // 由浏览器原生弹出。不区分"是否被截断"——所有标签都给，行为统一、
  // 不用在两条代码路径里分别记得维护这件事。
  // maxLen 可选：不传则用共享的 Chart.js 刻度截断阈值（maxLabel()）；
  // 甘特图的行标签需要按自己的可用像素宽度单独算一个更短的阈值，见 gantt()。
  function labelText(x, y, raw, fill, extraAttrs, maxLen) {
    var attrs = { x: x, y: y, fill: fill, 'font-size': 11 };
    Object.keys(extraAttrs || {}).forEach(function (k) { attrs[k] = extraAttrs[k]; });
    var t = el('text', attrs);
    t.textContent = maxLen != null ? truncateTo(raw, maxLen) : truncate(raw);
    var title = el('title', {});
    title.textContent = String(raw);
    t.appendChild(title);
    return t;
  }

  function unmount(host) {
    for (var i = registry.length - 1; i >= 0; i--) {
      // 同一个 host 的旧条目，或者 host 已经从文档里被整体移除（比如所在
      // 卡片被删除重建）的陈旧条目，都在这里一并摘掉。
      if (registry[i].host === host || !document.contains(registry[i].host)) {
        registry.splice(i, 1);
      }
    }
  }

  function mount(host, draw) {
    unmount(host);
    host.innerHTML = '';
    host.appendChild(draw());
    registry.push({
      host: host,
      redraw: function () {
        host.innerHTML = '';
        host.appendChild(draw());
      }
    });
  }

  DS.svg = {
    /* rows: Array<{label: string, bars: Array<{start, end, series?}>}> */
    gantt: function (host, rows, opts) {
      opts = opts || {};
      rows = rows || [];
      var rowH = 22, pad = 6, labelW = 120;
      // 行标签不能按共享的 maxLabel()（10 字）截断：那是给 Chart.js 刻度
      // 用的通用阈值，没考虑甘特图自己的 labelW。10 字中文在 11px 字号下
      // 实测宽度已经跟绘图区起点（labelW=120）只剩 4-6px 间隙，视觉上贴着
      // 条形。留一道 14px 的呼吸间隙（labelGutter），再按"每字约 11px"
      // 倒推允许的字数——绘图区起点仍然是 labelW，不挪动条形，只是让标签
      // 自己截得更短，给自己让出这道间隙。
      var labelGutter = 14;
      var rowLabelMaxLen = Math.max(1, Math.floor((labelW - labelGutter) / 11));

      function draw() {
        var c = colors();
        var h = opts.height || (rows.length * rowH + pad * 2);
        var w = host.clientWidth || 640;
        var plotW = Math.max(40, w - labelW - pad);

        var maxEnd = 1;
        rows.forEach(function (r) {
          (r.bars || []).forEach(function (b) { if (b.end > maxEnd) maxEnd = b.end; });
        });

        var svg = el('svg', {
          'class': 'ds-svg-chart', width: '100%', height: h,
          viewBox: '0 0 ' + w + ' ' + h
        });

        rows.forEach(function (r, i) {
          var y = pad + i * rowH;
          svg.appendChild(labelText(0, y + rowH * 0.7, r.label, c.text, null, rowLabelMaxLen));
          svg.appendChild(el('line', {
            x1: labelW, y1: y + rowH - 1, x2: w - pad, y2: y + rowH - 1,
            stroke: c.grid, 'stroke-width': 1
          }));
          (r.bars || []).forEach(function (b) {
            var bar = el('rect', {
              x: labelW + (b.start / maxEnd) * plotW,
              y: y + 3,
              width: Math.max(2, ((b.end - b.start) / maxEnd) * plotW),
              height: rowH - 8,
              rx: 3,
              fill: c.series[(b.series || 0) % c.series.length]
            });
            var title = el('title', {});
            title.textContent = r.label + '：' + b.start + '–' + b.end;
            bar.appendChild(title);
            svg.appendChild(bar);
          });
        });
        return svg;
      }

      mount(host, draw);
      return host.querySelector('svg');
    },

    /* matrix: number[][]; opts.rows/cols: 可选的行/列标签字符串数组 */
    heatmap: function (host, matrix, opts) {
      opts = opts || {};
      matrix = matrix || [];
      var pad = 2;
      var rowLabels = opts.rows || null;
      var colLabels = opts.cols || null;
      var labelW = rowLabels ? 70 : 0;
      var labelH = colLabels ? 22 : 0;

      function draw() {
        var c = colors();
        var cols = (matrix[0] || []).length;
        // 格子大小随宿主实际宽度自适应，而不是写死 22px——固定值在真实卡片
        // 宽度下要么挤成一小块、要么（列数少时）大片留白。按宿主可用宽度
        // 均分给每一列，夹在 [28, 72] 之间：太小挤不下数字/悬停目标，太大
        // 稀疏矩阵会显得突兀。
        var w0 = host.clientWidth || 640;
        var cell = Math.max(28, Math.min(72, Math.floor((w0 - labelW) / Math.max(1, cols))));
        var w = labelW + cols * cell;
        var h = labelH + matrix.length * cell;
        var flat = matrix.reduce(function (a, r) { return a.concat(r); }, []);
        var max = Math.max.apply(null, flat.concat([1]));

        var svg = el('svg', {
          'class': 'ds-svg-chart', width: '100%', height: h,
          viewBox: '0 0 ' + w + ' ' + h
        });

        if (colLabels) {
          colLabels.forEach(function (label, ci) {
            svg.appendChild(labelText(
              labelW + ci * cell + cell / 2, labelH - 5, label, c.text,
              { 'text-anchor': 'middle', 'font-size': 11 }
            ));
          });
        }

        matrix.forEach(function (row, ri) {
          if (rowLabels && rowLabels[ri] != null) {
            svg.appendChild(labelText(
              0, labelH + ri * cell + cell / 2 + 4, rowLabels[ri], c.text, { 'font-size': 10 }
            ));
          }
          row.forEach(function (v, ci) {
            var ratio = max > 0 ? v / max : 0;
            var rect = el('rect', {
              x: labelW + ci * cell + pad / 2,
              y: labelH + ri * cell + pad / 2,
              width: cell - pad, height: cell - pad, rx: 2,
              fill: c.series[0],
              // 色阶用单一系列色配不同不透明度实现，最低档也必须可见——
              // 纯透明会把"数值是 0"和"这里压根没有数据"混为一谈。
              // 2026-10-14 审查（Review D4）：地板值曾是 0.08——#0072b2 以
              // 8% 不透明度叠在深色主题 --color-surface(#18181b) 上合成得
              // rgb(22,31,39)，跟背景 rgb(24,24,27) 肉眼基本无法区分，直接
              // 推翻了上面这条注释自述的设计意图。改成 0.22（实测：合成色
              // 与背景对比度浅色主题 1.37、深色主题 1.23，均明显高于原 0.08
              // 档位的 1.12/1.06——用于判定的 svg-heatmap-min-opacity-visible
              // 断言也同步改成直接核验这个合成对比度，而不是只判 opacity>0）。
              'fill-opacity': Math.max(0.22, ratio)
            });
            var title = el('title', {});
            title.textContent = String(v);
            rect.appendChild(title);
            svg.appendChild(rect);
          });
        });
        return svg;
      }

      mount(host, draw);
      return host.querySelector('svg');
    }
  };

  document.addEventListener('ds:themechange', function () {
    // 逐个隔离：dispatchEvent() 不会把监听器里的异常传给调用方（DS.theme.set()
    // 照常返回），一个 host 画炸了不能把 registry 里排在它后面的图都拖下水
    // ——这正是 charts.js 的 retheme() 踩过并修复过的同一个坑。
    for (var i = registry.length - 1; i >= 0; i--) {
      var entry = registry[i];
      if (!document.contains(entry.host)) { registry.splice(i, 1); continue; }
      try {
        entry.redraw();
      } catch (e) {
        console.warn('DS.svg: 重绘失败', e);
      }
    }
  });
})(window.DS);
</script>
<script>/* demo/mockdata.js —— 合成演示数据。全部为编造值，不含任何真实机构、客户、
   样本或仪器序列号信息。用固定 seed 的伪随机数生成器保证每次渲染结果一致，
   浏览器端自测断言才可判定（否则图表/表格每次刷新内容都不同，无法写出有
   鉴别力的断言）。注意：下面 rng() 里 `s * 1103515245` 在 s 较大时乘积会
   超过 2^53，JS 的双精度浮点在取模前已经发生截断——这已经不是教科书式
   精确的线性同余生成器，只是"碰巧长得像"。但这不影响这里的用途：同一个
   seed 下浮点运算本身是确定性的（同一引擎每次算出完全相同的截断结果），
   序列依旧可复现，断言该判的是"确定性"，不是"均匀分布质量"。 */
window.DS_MOCK = (function () {
  'use strict';

  function rng(seed) {
    var s = (seed == null ? 42 : seed) >>> 0;
    return function () {
      s = (s * 1103515245 + 12345) % 2147483648;
      return s / 2147483648;
    };
  }

  function series(n, seed) {
    var r = rng(seed), out = [];
    for (var i = 0; i < n; i++) out.push(Math.round(20 + r() * 80));
    return out;
  }

  function months() {
    return ['一月', '二月', '三月', '四月', '五月', '六月',
             '七月', '八月', '九月', '十月', '十一月', '十二月'];
  }

  function instruments() {
    return ['一号仪器', '二号仪器', '三号仪器', '备用仪器'];
  }

  function tableRows(n) {
    var r = rng(7), names = instruments(), out = [];
    var states = ['正常', '待机', '报警'];
    for (var i = 0; i < n; i++) {
      out.push({
        batch: 'B' + (1000 + i),
        instrument: names[i % names.length],
        slides: Math.round(10 + r() * 90),
        minutes: Math.round(30 + r() * 150),
        state: states[Math.floor(r() * 3)]
      });
    }
    return out;
  }

  return { series: series, months: months, instruments: instruments, tableRows: tableRows };
})();

    var b = alpha * ch(fgHex, 4) + (1 - alpha) * ch(bgHex, 4);
    return '#' + toHex(r) + toHex(g) + toHex(b);
  }

        Math.abs(scatterChart.scales.x.min - scatterXBefore.min) < 0.01,
      'before=' + JSON.stringify(scatterXBefore) +
        ' after=' + scatterChart.scales.x.min + '/' + scatterChart.scales.x.max);

    DS.charts.setWheelMode('ctrl-zoom');
    DS.charts.resetZoom(c);
  });

  window.DS_SELFTEST_SUITES.push(function isolation(A) {
    // Review Focus #4：两个实例的缩放状态互不影响，没有模块级共享游标。
    var list = DS.charts.all();
    A.check('iso-two-instances', list.length >= 2, 'got ' + list.length);
    var a = list[0], b = list[1];
    DS.charts.resetZoom(a); DS.charts.resetZoom(b);
    DS.charts.zoom(a, 2);
    A.check('iso-a-zoomed', DS.charts.isZoomed(a) === true, '');
    A.check('iso-b-untouched', DS.charts.isZoomed(b) === false, '');
    A.check('iso-state-not-shared', a.$ds !== b.$ds, '');
    a.$ds.min = 0.75;
    A.check('iso-mutating-a-does-not-touch-b', b.$ds.min !== 0.75, 'got ' + b.$ds.min);
    DS.charts.resetZoom(a);
  });

  window.DS_SELFTEST_SUITES.push(function svgCharts(A) {
    var g = document.querySelector('#s-gantt svg');
    A.check('svg-gantt-rendered', !!g, '');
    A.check('svg-gantt-bar-count',
      g.querySelectorAll('rect').length === 3, 'got ' + g.querySelectorAll('rect').length);
    A.check('svg-gantt-uses-token-color',
      g.querySelector('rect').getAttribute('fill') === DS.charts.themeColors().series[0],
      'got ' + g.querySelector('rect').getAttribute('fill'));

    // 长标签截断：可见文字是 <text> 自身的第一个子节点（Text 节点），
    // <title> 是之后再 appendChild 进去的第二个子节点——不能读
    // firstLabel.textContent，它会把两者递归拼接到一起。
    var firstLabel = g.querySelector('text');
    var firstLabelVisibleText = firstLabel.childNodes[0].data;
    A.check('svg-gantt-label-truncated',
      firstLabelVisibleText.length <= 11 && firstLabelVisibleText.slice(-1) === '…',
      'got ' + firstLabelVisibleText);
    var firstTitle = firstLabel.querySelector('title');
    A.check('svg-gantt-label-title-has-full-text',
      !!firstTitle && firstTitle.textContent === ganttLongLabel,
      'got ' + (firstTitle && firstTitle.textContent));

    var hm = document.querySelector('#s-heat svg');
    A.check('svg-heatmap-cell-count',
      hm.querySelectorAll('rect').length === 6, 'got ' + hm.querySelectorAll('rect').length);
    A.check('svg-heatmap-color-from-token',
      hm.querySelector('rect').getAttribute('fill') === DS.charts.themeColors().series[0],
      'got ' + hm.querySelector('rect').getAttribute('fill'));

    // 色阶最低档也必须可见：矩阵里有一个数值为 0 的格子。只判 fill-opacity
    // > 0 对"是否可见"没有鉴别力（Review D4：原地板值 0.08，#0072b2 叠在
    // 深色主题背景上合成得 rgb(22,31,39)，跟背景 rgb(24,24,27) 几乎相同，
    // 但 0.08 本身仍然 > 0，断言测不出这个问题）。改成直接算地板不透明度
    // 合成出来的颜色跟背景的真实对比度，深浅两套主题都要过。
    var opacities = Array.prototype.map.call(hm.querySelectorAll('rect'), function (r) {
      return parseFloat(r.getAttribute('fill-opacity'));
    });
    var floorOpacity = Math.min.apply(null, opacities);
    var themeBeforeOpacityCheck = DS.theme.get();
    ['light', 'dark'].forEach(function (themeName) {
      DS.theme.set(themeName);
      var bg = getComputedStyle(document.documentElement)
        .getPropertyValue('--color-surface').trim();
      var seriesColor = DS.charts.themeColors().series[0];
      var composite = compositeOverBg(seriesColor, bg, floorOpacity);
      var cr = hexContrast(composite, bg);
      A.check('svg-heatmap-min-opacity-visible-' + themeName, cr >= 1.2,
        'opacity=' + floorOpacity + ' composite=' + composite + ' bg=' + bg +
          ' contrast=' + cr.toFixed(3));
    });
    DS.theme.set(themeBeforeOpacityCheck);

    // 复审发现：下面几条断言全部拿渲染结果反推 observedCell 当"地面真值"
    // 去验证偏移公式，这意味着"自适应公式本身算错了"（比如有人把整条公式
    // 换成写死的常量）完全测不出来——用 demo 默认的 3 列矩阵在真实卡片
    // 宽度下 cell 又恰好被钳到上限 72，范围断言 [28,72] 也卡在边界上，
    // 双重失明。这里用两个显式宽度（100px/200px，见 selftestMode 脚手架
    // 里的 #s-heat-w1/#s-heat-w2 探针容器，必须在可视布局里而不是
    // display:none，否则 clientWidth 塌缩成 0 只会命中兜底值 640）各渲一次
    // 同一个无行列标签的 3 列矩阵（labelW=labelH=0，公式简化成
    // floor(宿主宽/cols)），独立算出期望值，两个宽度都落在 [28,72] 内部、
    // 远离钳位边界，确保测的是公式本身而不是钳位分支。
    var probeMatrix = [[1, 2, 3], [4, 5, 6]];
    var w1Host = document.getElementById('s-heat-w1');
    var w2Host = document.getElementById('s-heat-w2');
    DS.svg.heatmap(w1Host, probeMatrix);
    DS.svg.heatmap(w2Host, probeMatrix);
    var padProbe = 2;
    var w1Cell = parseFloat(w1Host.querySelector('rect').getAttribute('width')) + padProbe;
    var w2Cell = parseFloat(w2Host.querySelector('rect').getAttribute('width')) + padProbe;
    var w1Expected = Math.floor(w1Host.clientWidth / 3);
    var w2Expected = Math.floor(w2Host.clientWidth / 3);
    A.check('svg-heatmap-cell-tracks-host-width-formula',
      w1Cell === w1Expected && w2Cell === w2Expected &&
        w1Cell !== w2Cell && w1Cell >= 28 && w1Cell <= 72 && w2Cell >= 28 && w2Cell <= 72,
      'w1=' + w1Cell + ' want ' + w1Expected + '; w2=' + w2Cell + ' want ' + w2Expected);

    // Task 8 新增：DS.svg.heatmap 的 opts.rows/opts.cols 公开参数——行列标签
    // 要渲染出来，且数据格要真的按 labelW/labelH 偏移，不是摆设配置。
    //
    // cell（格子边长）随宿主宽度自适应（见 charts-svg.js），不是写死的
    // 22px，断言不能再硬编码像素坐标——host.clientWidth 不同，cell 就不同，
    // 坐标也会跟着变。但也不能在断言里重新实现一遍"按宿主宽度算 cell"的
    // 自适应公式本身：那样"公式本身算错了"这种 bug 永远测不出来（断言和
    // 实现犯同一个错，自己骗自己）。改用第一个格子的渲染宽度反推出
    // observedCell 这个"地面真值"，再用它去验证偏移公式（labelW/labelH +
    // 行列号*cell + pad/2）是否被正确应用——这样验的是"偏移逻辑对不对"，
    // 不是"自适应公式对不对"。
    var colLabelEls = hm.querySelectorAll('text[text-anchor="middle"]');
    A.check('svg-heatmap-col-labels-rendered',
      colLabelEls.length === 3 && colLabelEls[0].childNodes[0].data === '上午',
      'count=' + colLabelEls.length);
    var allHeatRects = hm.querySelectorAll('rect');
    var firstDataRect = allHeatRects[0];
    var pad = 2;
    var observedCell = parseFloat(firstDataRect.getAttribute('width')) + pad;
    A.check('svg-heatmap-cell-size-in-adaptive-range',
      observedCell >= 28 && observedCell <= 72, 'got ' + observedCell);
    A.check('svg-heatmap-col-label-x-centered',
      colLabelEls[0].getAttribute('x') === String(70 + observedCell / 2),
      'got ' + colLabelEls[0].getAttribute('x') + ' want ' + (70 + observedCell / 2));
    var rowLabelEls = Array.prototype.filter.call(hm.querySelectorAll('text'), function (t) {
      return t.getAttribute('text-anchor') !== 'middle';
    });
    A.check('svg-heatmap-row-labels-rendered',
      rowLabelEls.length === 2 && rowLabelEls[0].childNodes[0].data === DS_MOCK.instruments()[0],
      'count=' + rowLabelEls.length);
    // 第一格（行0列0）的行列号都是 0，乘上 cell 还是 0，偏移公式退化成
    // labelW/labelH + pad/2，测不出"按 cell 伸缩"这部分逻辑——另查一个
    // 不在原点的格子（行1列1，matrix 按行优先顺序排列，第 5 个 <rect>）。
    A.check('svg-heatmap-cell-offset-by-labels',
      firstDataRect.getAttribute('x') === String(70 + pad / 2) &&
        firstDataRect.getAttribute('y') === String(22 + pad / 2),
      'x=' + firstDataRect.getAttribute('x') + ' y=' + firstDataRect.getAttribute('y'));
    var secondRowSecondColRect = allHeatRects[4];
    A.check('svg-heatmap-cell-offset-scales-with-cell-size',
      secondRowSecondColRect.getAttribute('x') === String(70 + 1 * observedCell + pad / 2) &&
        secondRowSecondColRect.getAttribute('y') === String(22 + 1 * observedCell + pad / 2),
      'x=' + secondRowSecondColRect.getAttribute('x') + ' y=' + secondRowSecondColRect.getAttribute('y') +
        ' observedCell=' + observedCell);

    // 主题重绘：六条分类序列色深浅主题同值，"颜色变了吗"天生恒真。改用两种
    // 有鉴别力的手法：1）栅格线颜色随主题变化；2）先把填充色污染成垃圾值，
    // 切主题后断言它被正确覆盖回当前 token 值。
    var themeBefore = DS.theme.get();
    var gridBefore = g.querySelector('line').getAttribute('stroke');
    g.querySelector('rect').setAttribute('fill', 'rgb(123, 45, 67)');
    hm.querySelector('rect').setAttribute('fill', 'rgb(9, 9, 9)');
    DS.theme.set(themeBefore === 'dark' ? 'light' : 'dark');

    var gridAfter = document.querySelector('#s-gantt svg line').getAttribute('stroke');
    A.check('svg-retheme-grid-color-changes',
      gridBefore !== gridAfter, gridBefore + ' -> ' + gridAfter);
    A.check('svg-gantt-retheme-restores-token-color',
      document.querySelector('#s-gantt svg rect').getAttribute('fill') === DS.charts.themeColors().series[0],
      'got ' + document.querySelector('#s-gantt svg rect').getAttribute('fill'));
    A.check('svg-heatmap-retheme-restores-token-color',
      document.querySelector('#s-heat svg rect').getAttribute('fill') === DS.charts.themeColors().series[0],
      'got ' + document.querySelector('#s-heat svg rect').getAttribute('fill'));
    DS.theme.set(themeBefore);

    // Task 7 遗留补测：DS.svg 的 registry 重绘时，一个宿主在重绘阶段
    // （不是首次挂载）抛错，不能拖垮其余宿主。两个 guard 分别挂载在 poison
    // 前后——不管遍历方向是正序还是逆序，poison 两侧总有一个排在它"之后"
    // 处理，只要隔离失效就必然有一个会露馅，断言不押在"遍历方向不变"这个
    // 假设上。同一组六条分类序列色深浅主题同值（tokens.css 的设计取舍）——
    // "颜色变了吗"对 guard 一样没有鉴别力，沿用上面刚验证过的套路：先把
    // guard 的填充染成垃圾值，断言它被正确覆盖回当前 token 值，这样只有
    // retheme 真的跑到 guard 身上才会通过。
    var guardHost = document.getElementById('s-iso-guard');
    var guardHost2 = document.getElementById('s-iso-guard2');
    guardHost.querySelector('rect').setAttribute('fill', 'rgb(1, 2, 3)');
    guardHost2.querySelector('rect').setAttribute('fill', 'rgb(4, 5, 6)');
    var svgRealWarn = console.warn;
    var svgWarnCalls = [];
    console.warn = function () { svgWarnCalls.push(Array.prototype.slice.call(arguments)); };
    DS.theme.set(DS.theme.get() === 'dark' ? 'light' : 'dark');
    console.warn = svgRealWarn;
    var guardColorAfter = guardHost.querySelector('rect').getAttribute('fill');
    var guardColorAfter2 = guardHost2.querySelector('rect').getAttribute('fill');
    A.check('svg-retheme-isolates-failing-host',
      guardColorAfter === DS.charts.themeColors().series[0] && guardColorAfter !== 'rgb(1, 2, 3)' &&
        guardColorAfter2 === DS.charts.themeColors().series[0] && guardColorAfter2 !== 'rgb(4, 5, 6)',
      'guard=' + guardColorAfter + ' guard2=' + guardColorAfter2);
    // 同一次主题切换里 charts.js 的 poisonChart 也会 console.warn，只断言
    // "调用过至少一次"会被那条不相干的 warn 顶替，即使 DS.svg 自己的
    // try/catch 失效、警告消失也测不出来（变异验证过：删掉 charts-svg.js
    // 里那句 console.warn('DS.svg: ...')，这条原本的写法仍然是绿的）。
    // 改成断言内容确实来自 DS.svg 自己的警告。
    var svgOwnWarn = svgWarnCalls.some(function (args) {
      return String(args[0]).indexOf('DS.svg') === 0;
    });
    A.check('svg-retheme-warns-on-host-failure', svgOwnWarn,
      'got ' + JSON.stringify(svgWarnCalls.map(function (a) { return String(a[0]); })));
    DS.theme.set(DS.theme.get() === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Task 8 新增：demo 页本身的断言 ---------- */
  window.DS_SELFTEST_SUITES.push(function demoPage(A) {
    A.check('demo-four-wheel-options',
      document.querySelectorAll('input[name=wheel]').length === 4, '');
    A.check('demo-default-is-ctrl-zoom',
      document.querySelector('input[name=wheel]:checked').value === 'ctrl-zoom', '');

    // 选择器切换必须立刻改变所有已存在实例的行为，无需重建图表。非笛卡尔
    // 图（c-pie）没有 $ds，不该被这条断言误判。
    //
    // 用带 ctrlKey 的滚轮事件，而不是不带 ctrl 的——默认的 ctrl-zoom 模式
    // 对"不按 Ctrl 的滚轮"本来就不拦截，如果选择器切换其实完全没生效，
    // 这条断言也会误判为通过（变异验证过：让 setWheelMode() 整体失效，
    // 不带 ctrl 的写法仍然是绿的）。page 模式必须连按住 Ctrl 的滚轮也放行，
    // 这才是和出厂默认 ctrl-zoom 真正二选一的行为。
    var pageRadio = document.querySelector('input[name=wheel][value=page]');
    pageRadio.checked = true;
    pageRadio.dispatchEvent(new Event('change', { bubbles: true }));
    var ev = new WheelEvent('wheel', { deltaY: -100, ctrlKey: true, cancelable: true });
    barChart.canvas.dispatchEvent(ev);
    A.check('demo-selector-takes-effect-live', ev.defaultPrevented === false, '');
    A.check('demo-selector-applies-to-all',
      DS.charts.all().every(function (c) { return !c.$ds || c.$ds.mode === 'page'; }), '');

    var back = document.querySelector('input[name=wheel][value=ctrl-zoom]');
    back.checked = true;
    back.dispatchEvent(new Event('change', { bubbles: true }));
    DS.charts.resetZoom(barChart);

    A.check('demo-two-live-charts', barChart !== null && lineChart !== null, '');
    A.check('demo-empty-state-shown', emptyChart === null &&
      !!document.querySelector('.ds-chart-empty'), '');
    A.check('demo-table-rows', document.querySelectorAll('#t-detail tbody tr').length === 8,
      'got ' + document.querySelectorAll('#t-detail tbody tr').length);
    A.check('demo-gantt-drawn', !!document.querySelector('#s-gantt svg'), '');
    A.check('demo-heatmap-drawn', !!document.querySelector('#s-heat svg'), '');
    A.check('demo-tabs-present',
      document.querySelectorAll('#nav-tabs .ds-tab').length === 2, '');

    // Review A2：?theme= 只用于本次会话展示（demo 页截图/视觉验收），
    // 绝不能写入 localStorage——否则分享一条带 ?theme=dark 的链接，访客
    // 打开过一次之后，往后不带参数访问也会被永久锁在深色。
    // themeOverrideStorageSnapshot 是覆盖代码跑完那一刻、早于任何 selftest
    // 套件自己调用 DS.theme.set() 之前取的快照，不会被本套件前面那些
    // 主题切换断言污染。
    A.check('demo-theme-override-does-not-persist',
      (themeOverride !== 'dark' && themeOverride !== 'light') ||
        themeOverrideStorageSnapshot !== themeOverride,
      'override=' + themeOverride + ' storageAtLoad=' + themeOverrideStorageSnapshot);
  });
})();

;
// demo/selftest.js —— 仅在 ?selftest=1 时运行的浏览器端断言套件。
(function () {
  'use strict';
  var results = [];

  var API = {
    check: function (name, cond, detail) {
      results.push([!!cond, name, detail || '']);
    },
    done: function () {
      var el = document.getElementById('selftest-result');
      el.textContent = results.map(function (r) {
        return (r[0] ? 'PASS\t' : 'FAIL\t') + r[1] + (r[0] ? '' : '\t' + r[2]);
      }).join('\n');
      el.setAttribute('data-done', '1');
    }
  };
  window.DS_SELFTEST = API;

  if (new URLSearchParams(location.search).get('selftest') !== '1') return;

  // 计算样式读取助手：返回元素某属性的计算值。
  // 元素不存在时返回哨兵字符串而不是 null —— null 对 `===` 型断言会正确失败，
  // 但对 `!==` 型断言（如「这个颜色不该是 xxx」）会让 "null !== xxx" 恒真，
  // 选择器写错或元素被删掉时断言会静默通过。哨兵字符串在两个方向都会正确失败。
  var MISSING = '<<MISSING>>';
  function css(sel, prop) {
    var el = document.querySelector(sel);
    if (!el) return MISSING;
    return getComputedStyle(el).getPropertyValue(prop).trim();
  }
  API.css = css;
  API.CSS_MISSING = MISSING;

  // 各模块的断言在自己的 registerTests 里注册，此处统一触发。
  // 延后两个宏任务，确保 demo.js 已完成首次渲染。
  // 注：原计划用双重 requestAnimationFrame，但 snap chromium 在
  // --headless --virtual-time-budget 模式下不产生合成帧，rAF 回调永不触发
  // （setTimeout 不受影响，已用 _render/t3.html 验证）。双重 setTimeout(fn, 0)
  // 效果等价（让出两轮事件循环），且不依赖合成器，故改用它。
  setTimeout(function () {
    setTimeout(function () {
      (window.DS_SELFTEST_SUITES || []).forEach(function (fn) {
        try { fn(API); } catch (e) { API.check('suite-threw:' + (fn.name || '?'), false, String(e)); }
      });
      API.done();
    }, 0);
  }, 0);
})();
</script>
