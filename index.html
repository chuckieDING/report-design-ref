<style>
/* tokens.css — 设计令牌契约。后续所有任务只许引用这里定义的变量名。
   色板已用 validate_palette.py 实测校验：
     - 文本/背景组合满足 WCAG AA（正文 4.5:1，大字与非文本 UI 3:1）
     - 六个图表序列色两两满足 ΔE(OKLab) 正常视觉 >=15、色觉障碍模拟(protan/deutan/tritan) >=6
   详见仓库根目录 palette.md 的实测记录。

   --color-primary/success/warning/danger 四个 token 只承担「填充/边框/图表」这一种用途
   （门槛 3:1）——按钮底色、卡片 hover 边框、图表系列色都直接用它们，不能为了小字可读性
   把它们整体加深，否则所有这些场景都会被拖暗。
   凡是「浅底徽标/提示条背景」与「贴在浅底或 surface 上的小字」（如 .ds-badge、
   .ds-stat-delta）两种更高门槛的用途，改用下面新增的 *-tint（非文本门槛）与
   *-ink（>=4.5，success/danger 的 ink 额外要求在 surface 上也 >=4.5）。 */

:root {
  --color-primary: #2563eb;
  --color-primary-light: #3b82f6;
  --color-primary-dark: #1d4ed8;
  --color-accent: #7c3aed;
  --color-success: #059669;
  --color-warning: #d97706;      /* 实测 on #ffffff = 3.19，已达 AA_LARGE(3.0)，填充/边框/图表用途无需加深；
                                     小字场景(badge/stat-delta)改用 --color-warning-ink，见下 */
  --color-danger: #dc2626;
  --color-surface: #ffffff;
  --color-surface-alt: #f8fafc;
  --color-surface-hover: #f1f5f9;
  --color-border: #e2e8f0;

  /* 浅底徽标/提示条背景：原色以 12% 不透明度叠在 --color-surface(#ffffff) 上的合成结果，
     写死成静态 hex（不用 rgba，避免和未来改动的基色失同步，也方便 validate_palette.py 直接读取）。
     非文本背景色，没有独立的对比度门槛。 */
  --color-primary-tint: #e5ecfd;
  --color-success-tint: #e1f2ed;
  --color-warning-tint: #faefe1;
  --color-danger-tint: #fbe5e5;

  /* 浅底徽标文字 / .ds-stat-delta 等小字专用：同色相、只压明度，
     要求 on 对应 -tint >= 4.5；success/danger 额外要求 on --color-surface 也 >= 4.5
     （.ds-stat-delta 直接贴 surface）。实测见 palette.md。 */
  --color-primary-ink: #1d4ed8;
  --color-success-ink: #047857;
  --color-warning-ink: #9f5704;  /* 2026-10-14 审查：原 #92400e on tint 实测 6.25，比同排 primary(5.66)/
                                     success(4.73)/danger(5.37) 明显偏棕、视觉不一致；改用 #9f5704
                                     （on tint 4.82，margin 0.32），同色相(amber)仅调回与其余三色同量级 */
  --color-danger-ink: #b91c1c;
  --color-text: #1e293b;
  --color-text-secondary: #64748b;
  --color-text-muted: #62738f;   /* 自 #94a3b8 加深：原值 on #ffffff = 2.56，远低于 AA_NORMAL(4.5)。
                                     同色相(slate)逐级插值找到的最接近原值且 >=4.5 的档位，实测 4.81 */
  /* 2026-10-14 审查（Review D5）：--color-border（#e2e8f0）on --color-surface
     仅 1.23:1，远低于 WCAG 1.4.11 对非文本 UI 边界的 3:1 门槛——.ds-btn.secondary
     （背景与所在卡片同色，唯一视觉边界就是这条边框）和 .ds-dropzone 的虚线边框
     都靠它才能被辨认出轮廓。新增这个专用 token 而不是直接改深 --color-border
     本身：它还用在表格分隔线、卡片/导航边框等纯装饰场景，那些地方 3:1 不是
     必需、改深了反而显得过重。直接复用已验算过的 --color-text-muted 同色值
     （4.81，远超 3:1 门槛），不再新调一个未经验证的颜色。 */
  --color-border-strong: #62738f;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.06);
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);

  /* 页面外壳 token（2026-10-22 布局沿用参照实现）：顶栏深底 + 页面背景渐变。
     css 规则里不得再写颜色字面量，外壳的色值只在这里定义。
     顶栏文字/页签/按钮边框是深底上的专用色（浅色主题与深色主题的顶栏都是深底）。 */
  --nav-bg: #1e293b;
  --nav-text: #f1f5f9;
  --nav-text-secondary: #cbd5e1;     /* on --nav-bg 实测 ≈ 9.8，页签/次级文字 */
  --nav-accent: #93c5fd;             /* on --nav-bg 实测 ≈ 8.1（深色主题 #a5b4fc on #0f172a ≈ 9.0），选中页签 */
  --nav-border: #94a3b8;             /* on --nav-bg ≈ 5.7，顶栏内按钮边框（非文本 3:1） */
  --page-bg-from: #f0f4ff;
  --page-bg-mid: #faf5ff;
  --page-bg-to: #f0fdf4;
  /* 全屏遮罩：纯黑半透明，与主题无关（模态遮罩 .45 是更早的既有例外，这里单独成 token） */
  --color-overlay: rgba(0,0,0,0.6);

  /* 图表专用：栅格线/坐标轴为装饰与刻度文本 */
  --chart-grid: #e2e8f0;
  --chart-axis: #62738f;         /* 原值 #94a3b8 同样只有 2.56，刻度数字是真文本，按 AA_NORMAL 一并修正 */

  /* 十条分类序列色（2026-10-22 重做，清爽优先）：沿用参照实现的 Tailwind 500 色系——
     明度/饱和度统一、偏亮——但参照实现原配色有近乎重复的几对（翠绿/青绿、紫/靛青、蓝/靛青），
     所以保持其明度档与色系、把色相拉开：十个色相在色轮上均匀分布，明度集中在「低档 L≈0.62 / 高档 L≈0.77」
     两档（s5 黄居中 0.71；两档交替是为了在明度这一维再拉开一点 ΔE），OKLab L 极差 ≤0.16（tests/test_palette.py 以 0.17 为上限锁定）。
     全部两两 ΔE(OKLab) ≥15（正常视觉）；不再要求对 surface ≥3:1、不再要求色觉障碍 ≥6——
     靠 tooltip 与数据标签做冗余补偿；色觉障碍各对 ΔE 只作报告，见 palette.md 第 7 节。
     s1..s6 供全部图表使用，s7..s10 目前只有桑基图用；s1..s6 内部两两也 ≥15。
     角色（仅供参考）：s1 蓝 / s2 橙 / s3 绿 / s4 紫 / s5 黄 / s6 品红粉 / s7 青 / s8 珊瑚 / s9 嫩绿 / s10 洋红。 */
  --chart-s1: #058ecf;
  --chart-s2: #d75a00;
  --chart-s3: #299c6a;
  --chart-s4: #9465e0;
  --chart-s5: #c1a007;
  --chart-s6: #d14c91;
  --chart-s7: #33c8e5;
  --chart-s8: #ff9082;
  --chart-s9: #45d476;
  --chart-s10: #eb77f6;

  /* 渐进色板（DS.charts.rampColors）：色相由 JS 按排名算，S/L 固定。浅色取参照实现值。 */
  --chart-ramp-s: 65%;
  --chart-ramp-l: 55%;
  /* 气泡标签字色：按"气泡填充与卡片底合成色"选对比度更高者 */
  --chart-label-ink-dark: #1e293b;
  --chart-label-ink-light: #fafafa;

  /* 甘特条内字色：DS.svg.gantt 按条的底色在这两个里取对比度更高的一个。必须是纯黑/纯白——
     任意底色对纯黑与纯白的对比度乘积恒为 21，所以较高者至少 √21≈4.58 ≥ 4.5；上面气泡用的
     #1e293b/#fafafa 在中等明度底色上两者都只有约 3.7。深浅主题同值。 */
  --gantt-ink-dark: #000000;
  --gantt-ink-light: #ffffff;
  /* 条内状态图标的投影：让图标在浅色档位上也有一圈轮廓 */
  --gantt-icon-halo: rgba(0,0,0,0.45);
}

[data-theme="dark"] {
  --color-primary: #818cf8;
  --color-primary-light: #a5b4fc;
  --color-primary-dark: #6366f1;
  --color-accent: #c084fc;
  --color-success: #4ade80;
  --color-warning: #fbbf24;
  --color-danger: #f87171;
  --color-surface: #18181b;
  --color-surface-alt: #09090b;
  --color-surface-hover: #27272a;
  --color-border: #3f3f46;

  /* 浅底徽标/提示条背景（深色主题里其实是「稍微提亮的深底」）：
     原色以 12% 不透明度叠在 --color-surface(#18181b) 上的合成结果，静态 hex。 */
  --color-primary-tint: #252636;
  --color-success-tint: #1e3027;
  --color-warning-tint: #332c1c;
  --color-danger-tint: #332325;

  /* 深色主题四个基色本身 on 对应 tint（以及 success/danger on surface）实测已经 >= 4.5，
     无需额外加深，ink 直接复用基色值（同色相、同明度）。 */
  --color-primary-ink: #818cf8;
  --color-success-ink: #4ade80;
  --color-warning-ink: #fbbf24;
  --color-danger-ink: #f87171;
  --color-text: #fafafa;
  --color-text-secondary: #d4d4d8;
  --color-text-muted: #a1a1aa;
  /* 同上（Review D5）：深色下 --color-border（#3f3f46）on --color-surface
     仅 1.70:1，同样复用已验算过的 --color-text-muted 同色值（6.91）。 */
  --color-border-strong: #a1a1aa;

  /* 深色主题：顶栏更深，页面背景为参照实现的纯深色（三段同值，渐变退化为纯色） */
  --nav-bg: #0f172a;
  --nav-accent: #a5b4fc;
  --page-bg-from: #09090b;
  --page-bg-mid: #09090b;
  --page-bg-to: #09090b;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -2px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.6), 0 4px 6px -4px rgba(0,0,0,0.4);
  --shadow-xl: 0 20px 40px -5px rgba(0,0,0,0.7), 0 8px 16px -6px rgba(0,0,0,0.5);

  --chart-grid: #27272a;
  --chart-axis: #a1a1aa;         /* 原值 #52525b on #18181b 仅 2.29，改用深色 text-muted 同值，实测 6.91 */

  /* 深色主题同十个色相，取 Tailwind 400 一档的明度（低档 L≈0.66 / 高档 L≈0.81，极差 ≤0.16），
     饱和度封顶在 C≤0.18，避开荧光色（早先的 #60f860 / #f8f8a8 已弃用）。浅色与深色取值各不相同。 */
  --chart-s1: #0298f2;
  --chart-s2: #e66123;
  --chart-s3: #27b49b;
  --chart-s4: #a374ef;
  --chart-s5: #e1c000;
  --chart-s6: #de5aa1;
  --chart-s7: #60ccff;
  --chart-s8: #ff9f86;
  --chart-s9: #5de17d;
  --chart-s10: #fa95f3;

  /* 深色渐进色板：气泡填充 0.7 叠在 #18181b 上会被压暗，合成后是柔和中档色（不荧光）。
     S 比浅色略低(60 vs 65)；L 与浅色同为 55：实测扫 50 个等距色相，L 落在 0.45–0.75
     时合成色亮度恰在"深字/浅字"对比度的交叉区，最差仅约 3.8；60/55 配下面更深的墨色，
     50 个色相上标签对比度最差 4.60（色相≈194°），全部 ≥4.5。 */
  --chart-ramp-s: 60%;
  --chart-ramp-l: 55%;
  /* 深色主题的深字取更深的 surface-alt 同值，使交叉区对比度从 3.8 抬到 4.6 */
  --chart-label-ink-dark: #09090b;
  --chart-label-ink-light: #fafafa;

  /* 甘特条内字色与图标投影：理由同浅色主题，深色主题同值 */
  --gantt-ink-dark: #000000;
  --gantt-ink-light: #ffffff;
  --gantt-icon-halo: rgba(0,0,0,0.6);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: linear-gradient(135deg, var(--page-bg-from) 0%, var(--page-bg-mid) 50%, var(--page-bg-to) 100%) fixed;
  min-height: 100vh;
  color: var(--color-text);
  font: 400 14px/1.6 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* components.css — 视觉组件层。颜色一律走 src/tokens.css 的变量，
   不得出现硬编码颜色字面量（#xxx / rgba(...)）。
   仅两处例外：.ds-btn.primary 的 color:#fff（白字压主色按钮，已验达标）
   与模态遮罩 rgba(0,0,0,.45)（纯黑半透明，与主题无关）。 */

/* ---------- 布局 ---------- */
/* 页面容器铺满窗口宽度（沿用参照实现 .container { max-width:100%; padding:24px 32px }）。 */
.ds-wrap { max-width: 100%; margin: 0; padding: 24px 32px 80px; }
.ds-grid { display: grid; gap: 24px; margin-bottom: 24px; }
/* Grid 子项默认 min-width:auto，会被里面定型过宽的 Chart.js 画布（全屏时 inline
   width 1358px）撑开，退出全屏后卡片/宿主不收回来。这是 Chart.js 响应式对容器的
   基本要求，所以作为库的默认值。 */
.ds-grid > * { min-width: 0; }
/* 图表网格：固定两列（窗口再宽也只两列，卡片随窗口变宽）。.ds-grid-2 是沿用的旧类名，
   与 .ds-charts-grid 同义。只在手机宽度（<=760px）才退成单列。 */
.ds-grid-2, .ds-charts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ds-grid-4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
@media (max-width: 760px) { .ds-grid-2, .ds-charts-grid { grid-template-columns: 1fr; } }
/* 可选：需要整行宽度的卡片自行加 .ds-card-wide，占满网格一整行（demo 默认不用） */
.ds-grid > .ds-card-wide { grid-column: 1 / -1; }

/* ---------- 顶栏与标签页 ---------- */
.ds-nav {
  display: flex; align-items: center; gap: 20px;
  background: var(--nav-bg);
  padding: 0 24px; position: sticky; top: 0; z-index: 50;
}
.ds-nav-title { font-size: 15px; font-weight: 700; padding: 14px 0; color: var(--nav-text); }
.ds-tabs { display: flex; gap: 4px; }
.ds-tab {
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--color-text-secondary); font: inherit; font-size: 13px;
  padding: 14px 12px; cursor: pointer; transition: color var(--transition);
}
.ds-tab:hover { color: var(--color-text); }
.ds-tab[aria-selected="true"] { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }
/* 顶栏是深底，页签与按钮改用顶栏专用 token（页面内的 .ds-tabs 不受影响） */
.ds-nav .ds-tab { color: var(--nav-text-secondary); }
.ds-nav .ds-tab:hover { color: var(--nav-text); }
.ds-nav .ds-tab[aria-selected="true"] { color: var(--nav-accent); border-bottom-color: var(--nav-accent); }
.ds-nav .ds-btn.secondary { background: transparent; color: var(--nav-text); border-color: var(--nav-border); }
.ds-nav .ds-btn.secondary:hover { background: transparent; border-color: var(--nav-accent); color: var(--nav-accent); }
/* 顶栏里的紧凑控件：小标签 + 控件（如 DS.seg 分段按钮），全页级设置放这里而不是侧栏菜单项。
   分段按钮在深底顶栏上改用顶栏 token：未选中 = 透明底 + 次级文字，选中 = --nav-accent 底 + --nav-bg 字
   （与"选中页签 on 顶栏底"同一对颜色，对比度对称 ≈ 8.1 / 9.0）。 */
.ds-nav-ctl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.ds-nav-ctl-label { font-size: 12px; color: var(--nav-text-secondary); white-space: nowrap; }
.ds-nav .ds-seg { border-color: var(--nav-border); }
.ds-nav .ds-seg-btn { background: transparent; color: var(--nav-text-secondary); border-left-color: var(--nav-border); }
.ds-nav .ds-seg-btn:hover { background: transparent; color: var(--nav-text); }
.ds-nav .ds-seg-btn[aria-pressed="true"] { background: var(--nav-accent); color: var(--nav-bg); }
.ds-nav .ds-seg-btn:focus-visible { outline-color: var(--nav-accent); outline-offset: -3px; }
/* 窄屏：顶栏放不下一行时换行（标题一行、控件一行），绝不横向溢出；每行上下留 8px */
@media (max-width: 760px) {
  .ds-nav { flex-wrap: wrap; gap: 8px 12px; padding-top: 8px; padding-bottom: 8px; }
  .ds-nav-title { padding: 4px 0; }
  .ds-nav-ctl { flex-wrap: wrap; }
}
.ds-panel[hidden] { display: none; }

/* ---------- 卡片与 KPI ---------- */
.ds-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 24px; margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  transition: border-color var(--transition), box-shadow var(--transition);
}
/* 网格里的间距由 gap 管，卡片自己不再叠 margin-bottom */
.ds-grid > .ds-card, .ds-grid > .ds-stat { margin-bottom: 0; }
.ds-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
.ds-card-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--color-text); }
/* 卡片标题写图表/组件类型，演示的能力写在说明文字里 */
.ds-card-desc { font-size: 12px; color: var(--color-text-secondary); margin: -4px 0 8px; line-height: 1.55; }
/* 卡片标题栏：左标题、右操作区（如分段按钮 .ds-seg）。标题仍是 .ds-card-title。 */
.ds-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; min-height: 26px; }
.ds-card-head .ds-card-title { margin: 0; }

/* ---------- 分段按钮 DS.seg：一组互斥的 toggle 按钮 ---------- */
.ds-seg { display: inline-flex; flex: none; border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.ds-seg-btn {
  font: inherit; font-size: 12px; line-height: 1; padding: 5px 10px; min-width: 32px;
  background: var(--color-surface); color: var(--color-text-secondary);
  border: 0; border-left: 1px solid var(--color-border); cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.ds-seg-btn:first-child { border-left: 0; }
.ds-seg-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
.ds-seg-btn[aria-pressed="true"] { background: var(--color-primary-tint); color: var(--color-primary-ink); font-weight: 600; }
.ds-seg-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
.ds-stat { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 18px; }
.ds-stat-label { font-size: 12px; color: var(--color-text-muted); display: flex; align-items: center; gap: 4px; }
.ds-stat-value { font-size: 26px; font-weight: 600; margin-top: 6px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ds-stat-delta { font-size: 12px; margin-top: 4px; color: var(--color-text-secondary); }
/* 12px 常规文字贴在卡片底上，4.5:1 门槛：必须用 -ink，不能用填充/图表用途的基色 */
.ds-stat-delta.up { color: var(--color-success-ink); }
.ds-stat-delta.down { color: var(--color-danger-ink); }

/* ---------- 数据表 ---------- */
.ds-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ds-table th {
  background: var(--color-surface-alt); color: var(--color-text-secondary);
  font-weight: 600; text-align: left; padding: 9px 12px;
  border-bottom: 1px solid var(--color-border);
  position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap;
}
.ds-table th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
.ds-table th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
.ds-table td { padding: 9px 12px; border-bottom: 1px solid var(--color-border); }
.ds-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
/* 数字列表头跟数据列同一个 .num 类名、配对右对齐（用户报的 bug）：
   `th` 默认靠 `.ds-table th { text-align: left }` 固定左对齐，数字列的
   `<th>` 之前没有任何机制让它跟着 `td.num` 一起右对齐——两者分别用各自
   的默认/显式对齐规则，视觉上整列错位将近一个列宽，标题下面显示的其实
   是左边那一列的数字。`DS.tables.sortable()` 会在初始化/重渲染后重新
   调用时自动给数字列的 `<th>` 补上这个类（见 src/interactions.js），
   这里只负责类名存在时该长什么样。 */
.ds-table th.num { text-align: right; }
.ds-table tbody tr:hover { background: var(--color-surface-hover); }

/* ---------- 徽标与按钮 ---------- */
.ds-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
/* 徽标背景用 -tint（静态 hex，非文本门槛），文字用 -ink（已验 on 对应 tint >= 4.5） */
.ds-badge.blue  { background: var(--color-primary-tint); color: var(--color-primary-ink); }
.ds-badge.green { background: var(--color-success-tint); color: var(--color-success-ink); }
.ds-badge.amber { background: var(--color-warning-tint); color: var(--color-warning-ink); }
.ds-badge.red   { background: var(--color-danger-tint);  color: var(--color-danger-ink); }
.ds-btn {
  font: inherit; font-size: 13px; padding: 7px 14px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer; transition: background var(--transition), border-color var(--transition);
}
.ds-btn.primary { background: var(--color-primary); color: #fff; }
.ds-btn.primary:hover { background: var(--color-primary-dark); }
/* 边框是这个按钮唯一的视觉边界（背景与所在卡片同色），用 --color-border-strong
   而不是 --color-border——后者 on --color-surface 只有 1.23:1(浅)/1.70:1(深)，
   达不到 WCAG 1.4.11 对非文本 UI 边界的 3:1（Review D5）。 */
.ds-btn.secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
.ds-btn.secondary:hover { background: var(--color-surface-hover); border-color: var(--color-primary); }
.ds-btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ---------- 提示条 ---------- */
/* 背景用对应的 -tint，边框用对应基色（非文本 UI，3:1 足够），文字保持 --color-text */
.ds-banner { padding: 12px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.55; border: 1px solid var(--color-border); background: var(--color-surface-alt); color: var(--color-text); }
.ds-wrap > .ds-banner { margin-bottom: 24px; }
.ds-banner.ok { border-color: var(--color-success); border-style: dashed; background: transparent; color: var(--color-text-muted); padding: 6px 14px; font-size: 12px; }
.ds-banner.warn { border-color: var(--color-warning); background: var(--color-warning-tint); color: var(--color-text); }
.ds-banner.bad { border-color: var(--color-danger); background: var(--color-danger-tint); color: var(--color-text); }
.ds-banner.info { border-color: var(--color-primary); background: var(--color-primary-tint); color: var(--color-text); }

/* ---------- 模态与上传区 ---------- */
.ds-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 160; }
/* 160 > 全屏图表的 150：全屏状态下从图表工具条打开的弹窗（数据表）必须盖在全屏图表之上；
   仍低于 toast(200)。 */
.ds-modal-backdrop[hidden] { display: none; }
.ds-modal { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); max-width: 90vw; max-height: 88vh; overflow: auto; padding: 20px; }
/* 同上（Review D5）：虚线边框是这个区域唯一的可识别轮廓，用 --color-border-strong。 */
.ds-dropzone { border: 2px dashed var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-surface); padding: 32px; text-align: center; color: var(--color-text-secondary); transition: border-color var(--transition); }
.ds-dropzone.dragover { border-color: var(--color-primary); background: var(--color-surface-hover); }

/* ---------- 图表数据表弹窗（DS.charts.attachTable / openTable） ---------- */
.ds-table-modal { min-width: min(560px, 80vw); display: flex; flex-direction: column; gap: 12px; }
.ds-table-modal-head { display: flex; align-items: center; gap: 10px; }
.ds-table-modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; color: var(--color-text); }
.ds-table-modal-search {
  width: 200px; font: inherit; font-size: 13px; padding: 6px 10px;
  background: var(--color-surface); color: var(--color-text);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
}
.ds-table-modal-search:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
.ds-table-modal-close {
  width: 28px; height: 28px; padding: 0; line-height: 1; font: inherit; font-size: 18px;
  background: var(--color-surface); color: var(--color-text-secondary);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); cursor: pointer;
}
.ds-table-modal-close:hover { color: var(--color-primary); border-color: var(--color-primary); }
.ds-table-modal-body { overflow: auto; max-height: 62vh; min-height: 200px; }
.ds-table-modal-empty { padding: 24px; text-align: center; color: var(--color-text-muted); font-size: 13px; }
.ds-table-modal-empty[hidden] { display: none; }

/* ---------- toast ---------- */
.ds-toast-host { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.ds-toast { background: var(--color-surface); border: 1px solid var(--color-border); border-left: 3px solid var(--color-primary); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 10px 14px; font-size: 13px; }

/* ---------- 图表容器与空态 ---------- */
.ds-chart-host { position: relative; height: 350px; min-width: 0; }
/* 空数据态只放一行提示文字，不需要和真实图表一样高的画布——沿用整卡
   350px 高在交付页上会留出大片空白。单独给这种"确定不会画图"的宿主
   一个矮一截的变体，内容（.ds-chart-empty）仍然用 position:absolute
   居中撑满，不用动。 */
.ds-chart-host--compact { height: 90px; }
.ds-chart-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted); font-size: 13px;
  border: 1px dashed var(--color-border); border-radius: var(--radius-md);
}

/* ---------- 图表缩放工具条（Task 6） ---------- */
.ds-chart-toolbar {
  position: absolute; top: 4px; right: 6px;
  display: flex; align-items: center; gap: 2px; z-index: 5;
}
.ds-chart-btn {
  width: 22px; height: 22px; line-height: 1; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--color-surface); color: var(--color-text-secondary);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  font: inherit; font-size: 12px; cursor: pointer;
}
.ds-chart-btn:hover { color: var(--color-primary); border-color: var(--color-primary); }
.ds-chart-btn svg { display: block; }
.ds-chart-hint { font-size: 10px; color: var(--color-text-muted); margin-left: 4px; white-space: nowrap; }
/* 全屏：遮罩（.ds-fs-backdrop，body 末尾）+ 居中面板（宿主本身）+ 标题栏（.ds-fs-head）。
   画布仍留在原宿主里、不搬家——Chart.js 靠"量容器"响应，搬动 DOM 会丢尺寸语义，
   而且往返后必须精确恢复画布与容器尺寸。面板：宽 min(95vw,1400px)、高 92vh、
   上下左右居中；顶部留出标题栏高度（padding-top），Chart.js 量容器时会扣掉 padding。 */
.ds-fs-backdrop {
  position: fixed; inset: 0; z-index: 149;
  background: var(--color-overlay); backdrop-filter: blur(4px);
}
.ds-chart-host.ds-chart-fullscreen {
  position: fixed; z-index: 150;
  top: 4vh; left: 0; right: 0; margin: 0 auto;
  /* !important：宿主常带自己的 inline 宽高或 #id 规则（比如单独加高的大图），全屏面板尺寸不能被它们盖掉 */
  width: min(95vw, 1400px) !important; height: 92vh !important;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: 64px 24px 24px; box-shadow: var(--shadow-xl);
}
.ds-fs-head {
  position: absolute; top: 24px; left: 24px; right: 24px; height: 28px;
  display: flex; align-items: center; gap: 12px;
}
.ds-fs-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-fs-head .ds-chart-btn { width: 28px; height: 28px; font-size: 18px; }
/* 全屏时工具条并进标题栏：在 × 左侧 */
.ds-chart-fullscreen > .ds-chart-toolbar { top: 27px; right: 64px; }

/* ---------- 桑基图节点筛选条（通用两侧多选下拉，见 charts.js 桑基小节）---------- */
.ds-sankey-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.ds-sankey-dropdown { position: relative; display: inline-block; }
.ds-sankey-drop-badge {
  display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 600;
  background: var(--color-primary-tint); color: var(--color-primary-ink);
  border-radius: 999px; padding: 0 6px;
}
.ds-sankey-drop-badge[hidden] { display: none; }
.ds-sankey-drop-list {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 200px;
  max-height: 220px; overflow: auto; background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-md); padding: 4px 0;
}
.ds-sankey-drop-list[hidden] { display: none; }
.ds-sankey-drop-item {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 12px;
  cursor: pointer; color: var(--color-text);
}
.ds-sankey-drop-item:hover { background: var(--color-surface-hover); }
.ds-sankey-drop-item.all { border-bottom: 1px solid var(--color-border); font-weight: 600; }
.ds-sankey-caption {
  position: absolute; top: 4px; left: 2px; z-index: 4; font-size: 11px;
  color: var(--color-text-muted); pointer-events: none;
}
.ds-sankey-drop-count { margin-left: auto; color: var(--color-text-muted); font-size: 11px; }

/* ---------- 特型图：甘特 / 热力（Task 7，手写 SVG） ---------- */
/* 字体/颜色都和 Chart.js 图表共用同一套 token：字体走 --font-sans，颜色
   由 charts-svg.js 从 DS.charts.themeColors() 取值后以 SVG 属性写在元素上，
   这里只负责排版层面的东西（不引入任何颜色字面量）。 */
.ds-svg-chart { display: block; font-family: var(--font-sans); max-width: 100%; }
.ds-svg-chart text { user-select: none; }

/* ---------- 甘特图 DS.svg.gantt（src/gantt.js，HTML 元素绘制） ----------
   几何尺寸（行高 36、条 top 7 高 24、轴高 30+标记行×22、药丸高 20）在 gantt.js 里也有一份
   常量，两边要一起改。条的底色/字色由 JS 从 token 解析后写成内联样式；其余颜色全走变量。
   层级：刻度数字 2 < 标记线 5 < 悬停的条 6 < 标记线标签 7 < sticky 行标签 8 < 左上角 9。
   标记线容器不设 z-index（不建层叠上下文），线与标签才能和条在同一层叠上下文里比较。 */
.ds-gantt { font-family: var(--font-mono); color: var(--color-text); }
.ds-gantt-scroll {
  overflow-x: auto; overflow-y: hidden;
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface);
}
/* overflow: clip 而不是 hidden：hidden 会让它变成滚动容器，行标签的 sticky 就改成相对它（不滚动）而失效 */
.ds-gantt-inner { position: relative; width: 100%; overflow: clip; }
.ds-gantt-head { display: flex; border-bottom: 1px solid var(--color-border); box-sizing: border-box; }
.ds-gantt-corner {
  flex: none; position: sticky; left: 0; z-index: 9; background: var(--color-surface);
  font: 600 11px var(--font-sans); color: var(--color-text-muted);
  display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 8px 4px 4px; box-sizing: border-box;
}
.ds-gantt-axis { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
.ds-gantt-tick { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--chart-grid); }
.ds-gantt-tick-text {
  position: absolute; bottom: 2px; left: 0; transform: translateX(-50%); z-index: 2;
  font-size: 10px; line-height: 12px; padding: 1px 4px; border-radius: 5px; white-space: nowrap;
  color: var(--chart-axis); background: var(--color-surface);
}
.ds-gantt-tick-text.is-start { transform: none; left: -1px; }
.ds-gantt-tick-text.is-end { transform: translateX(-100%); left: -1px; }
.ds-gantt-row { display: flex; align-items: center; box-sizing: border-box; border-bottom: 1px solid var(--color-border); }
.ds-gantt-body > .ds-gantt-row:last-child { border-bottom: 0; }
.ds-gantt-label {
  flex: none; position: sticky; left: 0; z-index: 8; align-self: stretch;
  display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box;
  padding: 0 8px 0 4px; background: var(--color-surface);
  font-size: 11px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden;
}
.ds-gantt-track { position: relative; flex: 1 1 auto; min-width: 0; align-self: stretch; }
.ds-gantt-bar {
  position: absolute; top: 7px; height: 24px; box-sizing: border-box;
  display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap;
  border-radius: 4px; font-size: 10px; font-weight: 600; cursor: default;
  box-shadow: var(--shadow-sm); transition: transform 100ms ease, box-shadow 100ms ease;
}
.ds-gantt-bar:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); z-index: 6; }
/* small：时长。不加 opacity——半透明会把字色往底色上混，条内字色的 4.5:1 就不成立了 */
.ds-gantt-bar small { font-size: .85em; font-weight: 500; margin-left: 4px; }
.ds-gantt-trunc { font-weight: 400; margin-left: 3px; }
/* 不写字的窄条去掉内边距：border-box 下 6+6 的内边距会把 8px 的最小宽撑成 12px */
.ds-gantt-bar.is-narrow { padding: 0; }
.ds-gantt-bar.is-lane { padding: 0; border-radius: 2px; box-shadow: none; }
.ds-gantt-bar.is-lane:hover { transform: scale(1.05); z-index: 6; }
.ds-gantt-icon {
  display: inline-flex; align-items: center; flex: none; margin-right: 3px; line-height: 1;
  filter: drop-shadow(0 0 1px var(--gantt-icon-halo));
}
.ds-gantt-icon svg { display: block; }
/* 入场：只在首次绘制播放（换主题/redrawIn 的重画不再闪一次）。用 clip-path 做"从左展开"，
   不用 scaleX——transform 会改变 getBoundingClientRect，动画期间量到的条宽会偏小 5%。
   fill-mode 用 backwards：结束后不残留 clip-path，否则悬停阴影会被裁掉。 */
.ds-gantt--anim .ds-gantt-bar { animation: ds-gantt-in 320ms cubic-bezier(0.4, 0, 0.2, 1) backwards; }
@keyframes ds-gantt-in {
  from { opacity: 0; clip-path: inset(0 5% 0 0); }
  to { opacity: 1; clip-path: inset(0 0 0 0); }
}
@media (prefers-reduced-motion: reduce) {
  .ds-gantt--anim .ds-gantt-bar { animation: none; }
  .ds-gantt-bar { transition: none; }
}
/* 标记线：容器宽 0、竖跨轴与全部资源行；线从自己的标签下方（top 内联）一直画到底 */
.ds-gantt-markers { position: absolute; top: 0; bottom: 0; right: 0; pointer-events: none; }
.ds-gantt-marker { position: absolute; top: 0; bottom: 0; width: 0; }
.ds-gantt-marker-line {
  position: absolute; left: -1px; bottom: 0; width: 0; z-index: 5;
  border-left-width: 2px; border-left-style: dashed; border-left-color: currentColor;
}
.ds-gantt-marker-label {
  position: absolute; z-index: 7; box-sizing: border-box; height: 20px;
  padding: 0 5px; border: 1px solid currentColor; border-radius: 8px;
  background: var(--color-surface); box-shadow: 0 0 0 2px var(--color-surface);
  font-size: 10px; font-weight: 600; line-height: 18px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* 图例：颜色档 chip / 状态 / 每条标记线；悬浮显示成员或说明 */
.ds-gantt-legend {
  display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px;
  font: 11px var(--font-sans); color: var(--color-text-secondary);
}
.ds-gantt-legend-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.ds-gantt-legend-text { color: var(--color-text-secondary); }
.ds-gantt-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; }
.ds-gantt-swatch-line { display: inline-block; width: 0; height: 11px; flex: none; border-left: 2px dashed currentColor; }
.ds-gantt-legend-item .ds-gantt-icon { margin-right: 0; color: var(--color-text-secondary); filter: none; }
/* 悬浮框：挂 body、fixed、不吃鼠标事件；显隐直接改 opacity（同步可观测，不靠过渡） */
.ds-gantt-tip {
  position: fixed; left: 0; top: 0; z-index: 9999; pointer-events: none; opacity: 0;
  max-width: 260px; padding: 8px 10px; border-radius: 7px; box-shadow: var(--shadow-lg);
  background: var(--color-text); color: var(--color-surface);
  font: 11px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-all;
}
.ds-gantt-empty {
  padding: 32px 16px; text-align: center; font: 13px var(--font-sans); color: var(--color-text-muted);
  border: 1px dashed var(--color-border); border-radius: var(--radius-md);
}
.ds-gantt-details { margin-top: 12px; font-family: var(--font-sans); }
.ds-gantt-details > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--color-text-secondary); padding: 4px 0; }
.ds-gantt-details-body { max-height: 320px; overflow: auto; margin-top: 6px; }

/* ---------- 侧边栏导航 DS.sidebar（左侧菜单 + 右侧面板；沿用参照实现的形态） ---------- */
/* 顶栏高度约 50px，sticky 的 top 取"顶栏 + 间距"；页面顶栏更高/更矮时覆盖 --ds-side-top 即可。 */
.ds-layout { --ds-side-top: 66px; display: flex; gap: 24px; align-items: flex-start; }
.ds-side-main { flex: 1; min-width: 0; }
.ds-sidebar {
  width: 230px; flex-shrink: 0; box-sizing: border-box;
  position: sticky; top: var(--ds-side-top); max-height: calc(100vh - var(--ds-side-top) - 16px); overflow: auto;
  display: flex; flex-direction: column; gap: 2px; padding: 4px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
  transition: width 250ms ease;
}
.ds-sidebar.ds-collapsed { width: 52px; overflow: hidden; }
.ds-side-item, .ds-side-toggle {
  display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
  background: none; border: 0; border-left: 3px solid transparent; border-radius: var(--radius-sm);
  font: inherit; font-size: 12px; text-align: left; padding: 9px 14px; cursor: pointer;
  color: var(--color-text-secondary); transition: all 250ms ease;
}
.ds-side-item:hover, .ds-side-toggle:hover { background: var(--color-surface-hover); color: var(--color-text); }
.ds-side-item:focus-visible, .ds-side-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: -2px; }
.ds-side-item[aria-current="true"] {
  background: var(--color-primary-tint); color: var(--color-primary-ink);
  border-left-color: var(--color-primary); font-weight: 600;
}
.ds-side-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: .7; }
.ds-side-item:hover .ds-side-icon { opacity: 1; }
.ds-side-item[aria-current="true"] .ds-side-icon { opacity: 1; color: var(--color-primary); }
.ds-side-toggle { color: var(--color-text-muted); border-bottom: 1px solid var(--color-border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; margin-bottom: 2px; }
.ds-side-toggle-icon { width: 18px; flex-shrink: 0; text-align: center; font-size: 14px; line-height: 1; }
.ds-side-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-side-group { font-size: 11px; font-weight: 600; color: var(--color-text-muted); padding: 10px 14px 4px; white-space: nowrap; }
/* 折叠：只剩图标；分组标题收起、留一条分隔线 */
.ds-collapsed .ds-side-item, .ds-collapsed .ds-side-toggle { padding: 10px 4px; justify-content: center; gap: 0; min-height: 44px; }
.ds-collapsed .ds-side-label { display: none; }
.ds-collapsed .ds-side-group { font-size: 0; height: 0; padding: 0; margin: 4px 8px; border-top: 1px solid var(--color-border); }
/* 折叠时悬停/聚焦浮出的文字提示（挂在 body，固定定位） */
.ds-side-tip {
  position: fixed; z-index: 170; pointer-events: none; white-space: nowrap;
  background: var(--color-text); color: var(--color-surface);
  padding: 5px 10px; border-radius: 4px; font-size: 12px; box-shadow: var(--shadow-md);
}
.ds-side-tip[hidden] { display: none; }
/* 面板：切换时纯 CSS 淡入（display:none → 显示会重新触发动画，无需 JS 驱动） */
.ds-side-panel[hidden] { display: none; }
.ds-side-panel { animation: ds-side-fade 300ms ease; }
@keyframes ds-side-fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ds-side-panel { animation: none; } .ds-sidebar, .ds-side-item { transition: none; } }
/* 窄屏（与图表网格同一个断点）：侧栏变成顶部横排，折叠按钮与折叠态不再起作用 */
@media (max-width: 760px) {
  .ds-layout { flex-direction: column; align-items: stretch; gap: 16px; }
  .ds-sidebar, .ds-sidebar.ds-collapsed {
    width: 100%; position: static; max-height: none; overflow: visible;
    flex-direction: row; flex-wrap: wrap;
  }
  .ds-side-toggle, .ds-side-group { display: none; }
  .ds-side-item, .ds-collapsed .ds-side-item {
    width: auto; flex: 0 0 auto; padding: 9px 12px; gap: 8px; justify-content: flex-start; min-height: 0;
    border-left-width: 0; border-bottom: 3px solid transparent;
  }
  .ds-side-item[aria-current="true"] { border-bottom-color: var(--color-primary); }
  .ds-collapsed .ds-side-label { display: inline; }
}

/* demo：桑基图要放 20+ 个项目节点，比默认 350px 的图表宿主高一些（全屏时仍由库的全屏类接管） */
#sankey-host:not(.ds-chart-fullscreen) { height: min(520px, calc(100vh - 120px)); }
/* demo：气泡图的气泡半径最大 35px，半宽卡片里要给 50 个气泡与标签避让留足高度 */
#bubble-host:not(.ds-chart-fullscreen) { height: 500px; }
</style>

<script>/* interactions.js —— DS 交互层：主题、标签页、表格排序、模态、toast。
   注意：本机 headless chromium 的 requestAnimationFrame 回调永不触发
   （该渲染模式不产生合成帧），本文件一律不使用 rAF 做任何延迟/动画驱动。 */
window.DS = window.DS || {};

(function (DS) {
  'use strict';

  var STORAGE_KEY = 'ds-theme';

  /* localStorage 在隐私模式、部分浏览器的 file:// 协议下会抛 SecurityError
     （本仓库用 ?nostorage=1 测试钩子在 demo 页模拟这一行为，见 demo/index.html）。
     整个主题模块必须在无持久化的情况下照常工作，只是记不住选择。 */
  function storageGet(key) {
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  }
  function storageSet(key, value) {
    try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
  }

  DS.theme = {
    get: function () {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    },
    set: function (mode) {
      var next = mode === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      storageSet(STORAGE_KEY, next);
      document.dispatchEvent(new CustomEvent('ds:themechange', { detail: { mode: next } }));
    },
    toggle: function () { DS.theme.set(DS.theme.get() === 'dark' ? 'light' : 'dark'); },
    init: function () {
      var saved = storageGet(STORAGE_KEY);
      if (saved !== 'dark' && saved !== 'light') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved);
    }
  };

  DS.tabs = {
    init: function (rootSelector) {
      var root = document.querySelector(rootSelector);
      if (!root) return;
      /* 幂等保护防的是"对同一个 root 元素重复挂监听器"，不是"这组 tabs
         一辈子只能绑一次"。监听器挂在事件委托的容器（root 本身）上，
         root.innerHTML = 新内容 不会移除挂在 root 自身上的监听器，重渲染
         之后不需要、也不会因为这条保护被拒绝而失效。 */
      if (root.dataset.dsTabsBound === '1') return;
      root.dataset.dsTabsBound = '1';
      root.addEventListener('click', function (ev) {
        var tab = ev.target.closest('.ds-tab');
        if (!tab || !root.contains(tab)) return;
        var target = tab.getAttribute('data-panel');
        root.querySelectorAll('.ds-tab').forEach(function (t) {
          t.setAttribute('aria-selected', String(t === tab));
        });
        /* 面板查询收敛到"这组 tabs 自己声明过的" data-panel 目标，不是
           document.querySelectorAll('.ds-panel') 的全文档扫描——否则页面上
           并存第二组独立 tabs 时，点 g2 的某个 tab 会把 g1 当前显示的面板
           也隐藏掉（Review B2）。面板通常是 root 的兄弟节点、不在 root
           内部，所以这里从 root 内所有 .ds-tab[data-panel] 收集这组 tabs
           自己名下的面板 id 全集，再按 id 去文档里找。每次点击都重新收集，
           不缓存成闭包变量——tabs 被重渲染、动态增删标签页之后也能跟着变
           （与 DS.tables.sortable 的委托思路一致，Review B1）。 */
        var panelIds = Array.prototype.map.call(
          root.querySelectorAll('.ds-tab[data-panel]'),
          function (t) { return t.getAttribute('data-panel'); }
        );
        panelIds.forEach(function (id) {
          var p = document.getElementById(id);
          if (p) p.hidden = (id !== target);
        });
      });
    }
  };

  // Review D3：报表里常见的"数值但不是裸数字字面量"的格式——千分位逗号
  // （1,234）、百分号（5%）、常见时长单位（3.5h / 12h，min/s 同理）、
  // hh:mm 或 m:ss 式的时长（02:14）。原来整列判定走 isFinite()，这些格式
  // 全部被判成非数字，整列退化成字典序，且是静默的（无报错、无警告），
  // 与 README 明确承诺的"数字列按数值"相悖。这里保守剥离这几种——不做
  // 通用单位剥离（任意后缀都摘掉风险太高，容易把本来就是文本的列，比如
  // 型号"3.5mm"，误判成数字列）。
  var TIME_COLON_RE = /^(\d{1,3}):([0-5]\d)$/;

  function parseSortableNumber(raw) {
    var t = TIME_COLON_RE.exec(raw);
    if (t) return parseInt(t[1], 10) * 60 + parseInt(t[2], 10);
    var stripped = raw.replace(/,/g, '').replace(/%$/, '').replace(/(h|min|s)$/i, '');
    return stripped !== '' && isFinite(stripped) ? parseFloat(stripped) : NaN;
  }

  // Bug 1（用户报的）：中文数字按拼音排序——"一号仪器/二号仪器/三号仪器/
  // 备用仪器"这类机台/产线/车间命名在报表里极其常见，此前整列落到
  // localeCompare(zh-Hans-CN) 的拼音序，"一"（yi）排到了"二"（er）、
  // "三"（san）后面。这里识别单元格*开头*的中文数字（0~99：〇/零、
  // 一~十、十一~十九、二十~九十九这类组合），按数值而不是拼音排序。
  //
  // 覆盖"两"吗？不覆盖。"两"在计数语境里确实等同"二"（两号机），但报表
  // 标签几乎总写"二号/二楼/二车间"，不写"两号/两楼"；反而"两难/两极/
  // 两性/两栖/两者/两全"这类常见词比对应的"二 + 字"组合常见得多，纳入
  // "两"会把误伤面扩大却换不来真实收益。真遇到"两号机"这类用法，再把
  // "两"加进 CN_DIGIT 并给对应的习语补黑名单。
  //
  // 不误伤"一次性""十字路口""百分之一"这类词，走两层规则：
  //   1）数字集合只到"十"，不含百/千/万——"百分之一"开头的"百"本来就不
  //      在识别范围内，第一步就不匹配，不需要额外规则。
  //   2）识别到的数字后面如果紧跟着一个把数字"虚化"成功能词/习语的字
  //      （十字、一次性、一下、十分……，见 CN_NUM_SUFFIX_BLACKLIST），
  //      整条放弃提取、退回原字符串处理。这张表不追求穷举——漏判（该提
  //      取的没提取）只是退回拼音序，不是错误；误判（不该提取的提取了）
  //      才会把本该当文本处理的列错误地当数字列处理，危害更大，所以只
  //      收录已知会出问题的高频用字，新发现误伤按需追加。
  // 数字可以是前缀（"一号仪器"）也可以独立成词（单元格整体就是"三"）：
  // 独立成词时没有"后面紧跟的字"，天然不会命中黑名单。
  var CN_DIGIT = {

  // 一致，断言才可判定。

  // 气泡标签截断：超过 max 个字符取前 max 个再加 '..'（恰好 max 个不截断）。
  function truncateName(name, max) {
    name = String(name);
    return name.length > max ? name.substring(0, max) + '..' : name;
  }

  // 框选反馈矩形：用 --color-primary 以半透明画在图表之上（填充 0.12、描边
  // 0.6）。不走 hexToRgba——token 若被换成非十六进制格式，hexToRgba 会退回不
  // 透明色，不透明的填充会把整张图盖住；globalAlpha 对任何颜色格式都成立。
  // 1 维（类目轴）框选画成贯穿绘图区的竖带/横带，xy 画真实矩形。
  var ZOOM_BOX_PLUGIN = {
    id: 'dsZoomBox',
    afterDraw: function (chart) {
      var s = chart.$ds, d = s && s.drag;
      if (!d || d.mode !== 'zoom' || !chart.chartArea) return;
      var a = chart.chartArea;
      var x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1);
      var y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
      if (!s.xy) {
        if (s.axis === 'x') { y0 = a.top; y1 = a.bottom; }
        else { x0 = a.left; x1 = a.right; }
      }
      var ctx = chart.ctx, col = cssVar('--color-primary');
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = col;
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = col;
      ctx.lineWidth = 1;
      ctx.strokeRect(x0 + 0.5, y0 + 0.5, Math.max(0, x1 - x0 - 1), Math.max(0, y1 - y0 - 1));
      ctx.restore();
    }
  };

  // 气泡标签：只给"大气泡"（x > 视野内最大 x 的 labelRatio，默认 15%）标名字，名字
  // 超过 labelMax（默认 12）个字符截断加 '..'。样式沿用参照实现：10px / 500、
  // 居中、不描边不发光（不用 strokeText / shadowBlur）。字色：标签画在气泡内部，
  // 真正的背景是"气泡填充色（alpha）与卡片底 --color-surface 合成后的颜色"，
  // 在 --chart-label-ink-dark / --chart-label-ink-light 两个 token 里选对比度更
  // 高者（任何背景下较高者必 ≥ 4.7）；浅色主题合成底偏亮，实际总是深字
  // 。每次绘制把"实际画出的标签"记在 chart.$dsBubbleLabels。
  // 绘制前按 chartArea 裁剪，缩放后视野外的气泡标签不能画到绘图区之外。
  var BUBBLE_LABELS_PLUGIN = {
    id: 'dsBubbleLabels',
    afterDatasetsDraw: function (chart) {
      if (!chart.config || chart.config.type !== 'bubble' || !chart.chartArea) return;
      var cfg = (chart.config.options && chart.config.options.dsBubble) || {};
      var ratio = cfg.labelRatio != null ? cfg.labelRatio : 0.15;
      var maxLen = cfg.labelMax || 12;
      var ctx = chart.ctx, a = chart.chartArea;
      var fam = (typeof Chart !== 'undefined' && Chart.defaults.font.family) || 'sans-serif';
      var inkDark = cssVar('--chart-label-ink-dark'), inkLight = cssVar('--chart-label-ink-light');
      var inkDarkC = parseCssColor(inkDark), inkLightC = parseCssColor(inkLight);
      var surfC = parseCssColor(cssVar('--color-surface'));
      var drawn = [];
      ctx.save();
      ctx.beginPath();
      ctx.rect(a.left, a.top, a.right - a.left, a.bottom - a.top);
      ctx.clip();
      ctx.font = '500 10px ' + fam;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // 避让：候选标签按数量降序依次尝试，包围盒（文字宽度 + 字号高度 + 内边距）与
      // 已画出的任何标签相交就跳过——冲突时留下的永远是数量更大的那个。被跳过的
      // 气泡仍可悬停看名字（悬浮框本来就有）。只在标签之间避让，不管压在别的
      // 气泡上（没有描边，重叠处更难读，所以避让更有必要）。视野外（缩放后）的气泡不参与：它不可见，也不
      // 该挡住视野内的标签。每次绘制都重算，所以缩放/全屏/换主题后自动更新。
      var cands = [];
      chart.data.datasets.forEach(function (d, di) {
        if (!chart.isDatasetVisible(di)) return;
        var meta = chart.getDatasetMeta(di);
        var data = d.data || [];
        // "大气泡"的基准取当前视野内的最大 x：放大到小气泡区域后，它们相对视野内
        // 最大者重新判定，否则按全量最大值永远不够格、放大了也不出标签。
        var maxX = 0;
        meta.data.forEach(function (el, i) {
          var p = data[i];
          if (!p || !isFinite(el.x) || !isFinite(el.y)) return;
          if (el.x < a.left || el.x > a.right || el.y < a.top || el.y > a.bottom) return;
          if (p.x > maxX) maxX = p.x;
        });
        meta.data.forEach(function (el, i) {
          var p = data[i];
          if (!p || p.name == null || !(p.x > maxX * ratio)) return;
          if (!isFinite(el.x) || !isFinite(el.y)) return;
          if (el.x < a.left || el.x > a.right || el.y < a.top || el.y > a.bottom) return;
          cands.push({ dataset: di, index: i, x: el.x, y: el.y, size: p.x, name: p.name });
        });
      });
      cands.sort(function (u, v) { return (v.size - u.size) || (u.dataset - v.dataset) || (u.index - v.index); });
      var boxes = [];
      cands.forEach(function (c) {
        var text = truncateName(c.name, maxLen);
        var w = ctx.measureText(text).width + 4, h = 10 + 4;
        var box = { l: c.x - w / 2, r: c.x + w / 2, t: c.y - h / 2, b: c.y + h / 2 };
        for (var k = 0; k < boxes.length; k++) {
          var o = boxes[k];
          if (box.l < o.r && box.r > o.l && box.t < o.b && box.b > o.t) return;
        }
        boxes.push(box);
        var textColor = inkDark, bgC = null;
        var fc = parseCssColor(chart.getDatasetMeta(c.dataset).data[c.index].options.backgroundColor);
        if (fc && surfC && inkDarkC && inkLightC) {
          bgC = compositeOver(fc, surfC);
          textColor = contrastOf(inkDarkC, bgC) >= contrastOf(inkLightC, bgC) ? inkDark : inkLight;
        }
        ctx.fillStyle = textColor;
        ctx.fillText(text, c.x, c.y);
        drawn.push({ dataset: c.dataset, index: c.index, text: text, x: c.x, y: c.y, color: textColor,
          bg: bgC, box: box });
      });
      ctx.restore();
      chart.$dsBubbleLabels = drawn;
    }
  };

  // ---------- 桑基图：通用图论工具函数（不感知任何业务维度） ----------
  //
  // 节点分层：只看 from/to 构成的有向图本身，和"接收点/仪器/结果"这类
  // 业务名词完全无关——没有任何入边的节点是第 0 层，其余节点的层号是
  // "所有入边来源节点层号的最大值 + 1"（经典的最长路径分层，桑基图的
  // 专业第三方实现内部做节点排布时也是同一类算法，这里只借用它的层号
  // 结果来分配颜色，不触碰布局）。实现用"反复松弛直到不再变化"的迭代法
  // 而不是递归拓扑排序：桑基图数据理论上应该是有向无环图，但调用方传入
  // 错误数据（比如笔误造成的环）时不该让这段颜色分配代码死循环或栈溢出——
  // guard 给了一个基于节点数的上限，循环中无法被任何入边更新到的节点
  // （包括真的处于环里的节点）最后统一兜底分到第 0 层，不影响颜色分配
  // 继续往下跑完。
  function sankeyNodeLayers(flows) {
    var hasIncoming = {};
    var keys = {};
    (flows || []).forEach(function (f) {
      if (!f) return;
      keys[f.from] = true;
      keys[f.to] = true;
      hasIncoming[f.to] = true;
    });
    var layer = {};
    var keyList = Object.keys(keys);
    keyList.forEach(function (k) { layer[k] = hasIncoming[k] ? null : 0; });
    var changed = true, guard = 0;
    while (changed && guard <= keyList.length + 1) {
      changed = false;
      guard++;
      (flows || []).forEach(function (f) {
        if (!f) return;
        var fromLayer = layer[f.from];
        if (fromLayer == null) return;
        var candidate = fromLayer + 1;
        if (layer[f.to] == null || candidate > layer[f.to]) {
          layer[f.to] = candidate;
          changed = true;
        }
      });
    }
    keyList.forEach(function (k) { if (layer[k] == null) layer[k] = 0; });
    return layer;
  }

  // 节点配色顺序：先按层号（sankeyNodeLayers）、同层内按"第一次出现的
  // 顺序"排成一条线，颜色 = 扩展序列色[序号 % 10]。这是参照实现"源端取
  // palette[i]、目标端取 palette[(i + 源端节点数) % N]"向 N 层的推广：
  // 相邻两层的序号区间首尾相接，只要相邻两层节点数之和 <= 色数（10），
  // 同层与相邻层就必然不撞色；超出时才开始取模复用（固有上限）。
  function sankeyNodeOrder(flows) {
    var layers = sankeyNodeLayers(flows);
    var seen = {}, keys = [];
    (flows || []).forEach(function (f) {
      [f && f.from, f && f.to].forEach(function (k) {
        if (k != null && !Object.prototype.hasOwnProperty.call(seen, k)) {
          seen[k] = true;
          keys.push(k);
        }
      });
    });
    var first = {};
    keys.forEach(function (k, i) { first[k] = i; });
    keys.sort(function (a, b) { return (layers[a] - layers[b]) || (first[a] - first[b]); });
    return keys;
  }

  // 按"流量"给节点和流向算一个排序优先级：专业第三方桑基插件支持传入
  // dataset.priority（数值越小越靠前）来减少连线交叉，这里按"该节点作为
  // from 或 to 出现时流量之和"从大到小排名，同样不关心业务维度，纯粹是
  // 数据里本来就有的 from/to/flow 三个字段的通用聚合。
  function sankeyPriority(flows) {
    var totals = {};
    (flows || []).forEach(function (f) {
      if (!f) return;
      totals[f.from] = (totals[f.from] || 0) + (f.flow || 0);
      totals[f.to] = (totals[f.to] || 0) + (f.flow || 0);
    });
    var ranked = Object.keys(totals).sort(function (a, b) { return totals[b] - totals[a]; });
    var priority = {};
    ranked.forEach(function (k, i) { priority[k] = i; });
    return priority;
  }

  // 按角色（'from' 或 'to'）聚合流量总和——节点筛选下拉的计数、以及任何
  // 需要"这个节点一共流过多少"的场景都复用这个纯函数，不内置任何业务名词。
  function sankeyGroupTotals(flows, field) {
    var totals = {};
    (flows || []).forEach(function (f) {
      if (!f) return;
      var key = f[field];
      if (key == null) return;
      totals[key] = (totals[key] || 0) + (f.flow || 0);
    });
    return totals;
  }

  // 高亮关联集合：给定当前完整流向数组和一组"种子"节点键（Set，null/空
  // 表示没有高亮），找出所有与种子直接相连的流向，把这些流向两端的节点键
  // 都并入返回集合——种子节点自己也会在返回结果里（种子必然是它自己所在
  // 那条流向的一端）。返回 null 表示"当前没有高亮，全部按原色画"，和返回
  // 一个空对象是两种不同的语义，调用方用 `connected == null` 判断前者。
  function sankeyConnectedKeys(flows, seeds) {
    if (!seeds || !seeds.size) return null;
    var connected = {};
    (flows || []).forEach(function (f) {
      if (!f) return;
      if (seeds.has(f.from) || seeds.has(f.to)) {
        connected[f.from] = true;
        connected[f.to] = true;
      }
    });
    return connected;
  }

  // 悬浮/点击高亮时，非关联流向与节点要"淡出"但不能是硬编码颜色字面量。
  // 选用 --chart-grid：它本来就是"装饰性、不是信息本身"的网格线颜色，深浅
  // 两套主题下都已经是经过设计的中性灰，语义上正好对应"这部分现在不是
  // 重点"，不需要再新增 token 或做颜色混合运算。
  function sankeyDimColor() { return cssVar('--chart-grid'); }

  // 节点配色查不到时的兜底色（正常不会走到——nodeIndexByKey 在 paint() 里
  // 对当前数据集的每个节点都会赋值——但防御性地给一个中性灰而不是任由
  // Canvas 把非法值静默吞掉，道理和「技术陷阱」#26 一样：节点描边/标签色
  // 被 chartjs-chart-sankey 当普通字符串用，传入 undefined 不会报错，只会
  // 悄悄复用上一帧颜色。）
  function sankeyFallbackColor() { return cssVar('--chart-axis'); }

  // 工具条（放大/缩小/复位/全屏）用 position:absolute 悬浮在宿主右上角，
  // Chart.js 默认把图例画在画布最顶上，多数据集图表的图例一旦够宽，最右边
  // 的条目会被工具条整个盖住（复审实测：三项图例的堆叠柱状图，第三项
  // "设备C"被压得只剩"设备"二字，深浅主题都复现）。此前没暴露是因为这批
  // 之前所有笛卡尔图的图例都只有 1 项，不会伸到右上角。
  //
  // 这里曾经的修法是 paint() 无条件给所有笛卡尔图注入
  // `layout.padding.top = 30`——对"图例+绘图区"整体让出一段顶部留白，简单
  // 但代价是**所有**笛卡尔图都要付这 30px，不管这张图的图例有没有可能伸到
  // 工具条所在的角落。后果在小容器上暴露得最明显：`.ds-chart-host--compact`
  // （components.css 里正式支持的 90px 矮宿主规格）配上真实数据时，绘图区
  // 被压到只剩 1.6px（实测复现），图表事实上不可用——compact 规格本来就
  // 不可能撞上工具条（宿主矮到工具条按钮都放不下的程度），这 30px 纯粹是
  // 陪绑。
  //
  // 现在改成按需留白：不在 paint() 里无条件写，而是在 create() 里
  // `new Chart()`、`_mountToolbar()` 都跑完之后做一次性后验校正——这时候
  // 图例已经真实布局过（`chart.legend.legendHitBoxes` 可读，逐项命中框，
  // 和 `chart.width`/`canvas.width` 同一坐标系，已实测确认），工具条 DOM
  // 也已经挂上（`getBoundingClientRect()` 能量出它的真实占位，包括随滚轮
  // 模式变化的提示文案宽度——不用固定估值）。两边都是真实几何坐标，拿来
  // 判断是否真的重叠，重叠才补 `layout.padding.top`，不重叠（单项图例、
  // 或容器矮于 `LEGEND_TOOLBAR_MIN_HOST_HEIGHT` 这种工具条本来就不会贴上去
  // 的情形）就不补——见 `_fitToolbarLegend()`。
  //
  // 创建时是一次性判定，不会随后续容器缩放自动重新检测——但 create() 里
  // 把 chart.resize 包了一层（见那里的说明），之后任何一次 resize()，不管
  // 是本库全屏按钮触发的、调用方自己手动调的，还是 Chart.js 内置
  // ResizeObserver 在容器尺寸变化（包括从 display:none 变可见）时自动触发
  // 的，都会在 resize 完成后重新判一次。'把图表所在的隐藏标签页切到可见'
  // 这类场景因此大多不需要调用方知道 _fitToolbarLegend 这个内部方法的
  // 存在——已实测验证：用真实的 `--headless=new`（而不是冻结渲染循环的
  // `--virtual-time-budget` 模式）加载 demo 页、只点标签页切换、不手动调
  // 任何 resize()，三项图例的堆叠柱状图图例依然正确避开了工具条，说明
  // ResizeObserver 确实会调用到这层包装。真正还需要手动补调 resize() 的，
  // 只剩下本仓库这一种本身就不支持 ResizeObserver 依赖的
  // requestAnimationFrame 的特殊测试环境（headless chromium 的
  // `--virtual-time-budget` 模式）——这是这类环境本来就有的已知限制（和
  // 全屏按钮 Bug 2 修复时踩的是同一个坑），不是这次改动新引入的，`demo.js`
  // 的 selftest 套件已经对这几张图表手动补了 resize()，可以直接参考。
  //
  // 包装只拦 resize，不拦 update：_fitToolbarLegend() 自己需要调整时只调
  // chart.update()，不会递归触发这层包装，不用担心死循环。
  //
  // 这里还踩过一个坑：曾经试过不包一层 resize，而是用 Chart.js 插件的
  // `afterLayout` 钩子全局接管、每次布局都自动重判——实测发现这条路不稳：
  // `new Chart()` 构造过程内部会先触发至少一次 `afterLayout`（这时
  // `legendHitBoxes` 还没来得及在这一轮里稳定，量到的是过渡态），而且一旦
  // 留白生效，图例会被推到工具条纵向范围以下，下一次自动重判会看到"现在
  // 不重叠了"而把刚加上的留白原地撤销，形成"加上留白 → 查出来不重叠 →
  // 撤销留白 → 又重叠"的判定来回（实测这条链路在一次 create() 里就能来回
  // 两轮，没有扩散成死循环只是因为"期望值等于当前值就不动"的幂等保护在
  // 第二轮之后刚好停在了一个巧合的状态，不能指望这个巧合）。判断本身要做
  // 归一化处理（见 legendOverlapsToolbar 的 appliedPaddingTop 参数）才能
  // 根治这个问题，但触发时机仍然改成只挂 resize——每次布局都重判的频率
  // 对这个场景来说是过度的，resize 已经覆盖了所有真正会让图例/工具条相对
  // 位置变化的时刻。
  //
  // 调用方自己配置过 `layout.padding.top` 的话优先尊重，不被这套逻辑碰——
  // 用独立的 `__dsAutoPaddingTop` 标志区分"这是我们自动写的"还是"调用方自己
  // 写的"，和 `__dsAutoBg`/`__dsAutoBorder` 是同一个模式。
  var TOOLBAR_TOP_RESERVE = 30;

  // 低于这个宿主高度（单位 px）直接跳过留白判断——compact 规格（90px）就是
  // 要豁免的典型：这么矮的宿主里，图例和工具条本来就不可能同时有伸展空间
  // 让两者真的撞上，谈"按需留白"没有意义，徒增判断成本还可能在极端布局下
  // 把本就紧张的高度压得更紧。150 在 90（compact）和 260（常规）之间留了
  // 余量，不贴着 compact 的具体数值写。
  var LEGEND_TOOLBAR_MIN_HOST_HEIGHT = 150;

  // 判断图例是否真的被工具条遮住：取图例的逐项命中框（legendHitBoxes）和
  // 工具条 DOM 的真实包围盒，换算到同一个"相对 canvas 左上角"的坐标系里做
  // 矩形相交判断。不用固定估值（工具条宽度随滚轮模式提示文案变化，最长是
  // "滚轮缩放，到底翻页"），也不只比较"图例顶边 vs 工具条底边"这种整体粗
  // 判断——那样会漏掉"图例没换行、但前几项离左边很近，工具条只压住最后
  // 一项的一部分"这类局部重叠。
  //
  // appliedPaddingTop 是"这张图当前已经由我们自己注入的 layout.padding.top"
  // （没注入过就是 0）。判断前先把每个命中框的纵坐标减去这个值，换算回
  // "假设没加过这段留白"的基准线上再比——不能直接用命中框的当前坐标判断：
  // 留白一旦生效，图例会被整体推低到工具条纵向范围以下，这时候如果不做这
  // 个还原，会读到"现在不重叠了"，反而把刚加上的留白当成不需要而撤销掉，
  // 形成"加留白→查出不重叠→撤销→又重叠"的判定来回（实测复现过，见
  // TOOLBAR_TOP_RESERVE 定义处的说明）。
  function legendOverlapsToolbar(chart, host, appliedPaddingTop) {
    var legend = chart.legend;
    if (!legend || !legend.options || legend.options.display === false) return false;
    if ((legend.options.position || 'top') !== 'top') return false;
    var hitBoxes = legend.legendHitBoxes;
    if (!hitBoxes || !hitBoxes.length) return false;
    var toolbarEl = host.querySelector('.ds-chart-toolbar');
    if (!toolbarEl) return false;
    var canvasRect = chart.canvas.getBoundingClientRect();
    // 画布 0 尺寸（典型：宿主正处于 `hidden` 标签页里，display:none 的
    // 祖先把整条子树的布局盒都收缩成 0）时，getBoundingClientRect() 全是
    // 0，没有真实几何可比——判"不重叠"更安全，等调用方让宿主真正可见、
    // 触发一次 resize()/update() 并重新调用 _fitToolbarLegend() 之后会用
    // 真实尺寸重新判一次（见 TOOLBAR_TOP_RESERVE 定义处的说明）。
    if (canvasRect.width === 0 || canvasRect.height === 0) return false;
    var toolbarRect = toolbarEl.getBoundingClientRect();
    var tLeft = toolbarRect.left - canvasRect.left;
    var tRight = toolbarRect.right - canvasRect.left;
    var tTop = toolbarRect.top - canvasRect.top;
    var tBottom = toolbarRect.bottom - canvasRect.top;
    return hitBoxes.some(function (hb) {
      var hLeft = hb.left;
      var hRight = hb.left + hb.width;
      var hTop = hb.top - appliedPaddingTop;
      var hBottom = hTop + hb.height;
      return hLeft < tRight && hRight > tLeft && hTop < tBottom && hBottom > tTop;
    });
  }

  // entry.chart.canvas 在 chart.destroy() 后会被 Chart.js 置为 null，
  // 用它判断实例是否还活着；registry 里 destroy 之后的死实例要物理摘除，
  // 否则 entry 会一直强引用 Chart 实例 + 原始 config（连带整份 dataset）不释放。
  function isAlive(entry) { return !!(entry.chart && entry.chart.canvas); }

  function pruneDestroyed() {
    for (var i = registry.length - 1; i >= 0; i--) {
      if (!isAlive(registry[i])) registry.splice(i, 1);
    }
  }

  // 节点矩形的颜色实际由 chartjs-chart-sankey 控制器在每次 draw() 时，按
  // "最后一条触碰到这个节点的流向记录"的 colorFrom/colorTo 结果重新赋值
  // （源码 draw() 里对 meta.data 逐条流向做 `node.color = flow.options.
  // colorFrom` 这类赋值，顺序取决于数据数组顺序，不保证同一个节点被哪条
  // 流向"写最后一笔"）。如果节点的高亮/淡出判断也放在 colorFrom/colorTo
  // 里按"这一条流向是否关联"来决定，同一个节点被两条流向触碰、一条关联
  // 一条不关联时，最终画出来是哪个颜色就变成了跟数据顺序绑定的未定义行为。
  // 用一个独立的 afterDraw 插件按"节点键本身在不在关联集合里"重新整个
  // 刷一遍节点矩形，颜色判断只依赖节点身份、不依赖是哪条流向触发的重绘，
  // 彻底绕开这个顺序依赖——在节点没有被排除出 chartjs-chart-sankey 自己的
  // 任何渲染路径的前提下，这是补丁式的二次覆盖，不是替代绘制。
  var SANKEY_HIGHLIGHT_PLUGIN = {
    id: 'dsSankeyHighlight',
    afterDraw: function (chart) {
      if (!chart || !chart.config || chart.config.type !== 'sankey') return;
      var state = chart.$dsSankey;
      var active = state && state.active;
      if (!active || !active.size) return;
      var meta = chart.getDatasetMeta(0);
      var ctrl = meta && meta.controller;
      if (!ctrl || !ctrl._nodes) return;
      var ds0 = chart.data.datasets[0];
      var flows = (ds0 && ds0.data) || [];
      var connected = sankeyConnectedKeys(flows, active);
      if (!connected) return;
      var xScale = chart.scales.x, yScale = chart.scales.y;
      if (!xScale || !yScale) return;
      var nodeWidth = (ds0 && ds0.nodeWidth) || 10;
      var sizeMode = (ds0 && ds0.size) || 'max';
      var sizeFn = sizeMode === 'min' ? Math.min : Math.max;
      var dim = sankeyDimColor();
      var ctx = chart.ctx;
      ctx.save();
      var colorOf = state.colorOf;
      ctrl._nodes.forEach(function (node, key) {
        // 一跳连通集内的节点用自己的基础色重刷（D1 之后整条流向全亮/全灰，
        // 同一个节点被亮流向和灰流向同时触碰时，控制器"最后一笔"可能是灰
        // 的，必须在这里按节点身份纠正）；连通集外的节点刷成淡出色。
        var fill = connected[key] ? (colorOf && colorOf(key)) : dim;
        if (!fill) return;
        var x = xScale.getPixelForValue(node.x);
        var y = yScale.getPixelForValue(node.y);
        var flow = sizeFn(node.in || node.out, node.out || node.in);
        var h = Math.abs(yScale.getPixelForValue(node.y + flow) - y);
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, nodeWidth, h);
      });
      ctx.restore();
    }
  };

  // 每一列节点铺满绘图区纵向高度。chartjs-chart-sankey 给每列节点之间留同
  // 样的固定间距（nodePadding），y 轴比例按"节点总高 + 间距"最大的那一列定，
  // 节点少的列于是提前结束、下方留白。这里在控制器 update() 之前（此时解析
  // 结果 _parsed 与节点 y 都已就绪，但流向元素还没按 _parsed 取像素）按列
  // 重排节点的 y：首节点贴顶（y=0）、末节点贴底（y=最大列底=轴最大值），多
  // 出的空间均匀分到节点间距里；节点高度（流量）一个字不动。流向两端的 y 是
  // 解析时写进 _parsed 的（节点 y + 该流向在节点内的偏移 addY），所以必须
  // 同步重写 _parsed[i].y 与 _custom.y，否则流向会留在旧位置、与节点错位。
  // 每次都从当前 y 排序后重新分配，天然幂等（重复 update、全屏变高都安全；
  // 数据空间里的分布与像素高度无关，全屏后轴自动拉伸，仍然铺满）。
  // 只有 1 个节点的列无法"首贴顶末贴底"，取居中。不用 requestAnimationFrame。
  function sankeyFillColumns(chart, args) {
    var meta = args && args.meta;
    var ctrl = meta && meta.controller;
    if (!ctrl || !ctrl._nodes || !ctrl._nodes.size) return;
    var ds = chart.data.datasets[args.index] || {};
    var sizeFn = ds.size === 'min' ? Math.min : Math.max;
    var cols = {}, maxBottom = 0;
    ctrl._nodes.forEach(function (n) {
      n._h = sizeFn(n.in || n.out, n.out || n.in);
      (cols[n.x] = cols[n.x] || []).push(n);
      if (n.y + n._h > maxBottom) maxBottom = n.y + n._h;
    });
    Object.keys(cols).forEach(function (k) {
      var col = cols[k].sort(function (a, b) { return a.y - b.y; });
      var total = 0;
      col.forEach(function (n) { total += n._h; });
      var y;
      if (col.length === 1) {
        col[0].y = (maxBottom - total) / 2;
        return;
      }
      var gap = (maxBottom - total) / (col.length - 1);
      y = 0;
      col.forEach(function (n) { n.y = y; y += n._h + gap; });
    });
    function addY(list, key, index) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].key === key && list[i].index === index) return list[i].addY;
      }
      return 0;
    }
    var raw = (ds.data || []);
    var parsed = meta._parsed || [];
    for (var i = 0; i < parsed.length && i < raw.length; i++) {
      var f = ctrl._nodes.get(raw[i].from), t = ctrl._nodes.get(raw[i].to);
      if (!f || !t || !parsed[i] || !parsed[i]._custom) continue;
      parsed[i].y = f.y + addY(f.to, raw[i].to, i);
      parsed[i]._custom.y = t.y + addY(t.from, raw[i].from, i);
    }
  }
  var SANKEY_FILL_PLUGIN = {
    id: 'dsSankeyFill',
    beforeDatasetUpdate: function (chart, args) {
      if (!chart || !chart.config || chart.config.type !== 'sankey') return;
      sankeyFillColumns(chart, args);
    }
  };

  // 点击落在哪条流向上时，决定高亮 from 还是 to：按点击的横坐标落在图表
  // 绘图区中线的左边还是右边——约定上左半边离"流出端"更近、右半边离
  // "流入端"更近，不需要知道这条流向具体画在哪个像素位置。
  function sankeyClickedEndpoint(chart, flow, nativeEvent) {
    var rect = chart.canvas.getBoundingClientRect();
    var clickX = nativeEvent.clientX - rect.left;
    var mid = (chart.chartArea.left + chart.chartArea.right) / 2;
    return clickX < mid ? flow.from : flow.to;
  }

  // 重新量容器后 resize：先把画布的 inline 宽度收起来再量。Chart.js 响应式
  // 靠"量容器"，但画布自己带着上一次定型的 inline width（全屏时是 1358px）；
  // 如果容器是 Grid/Flex 子项，子项的 min-width:auto 会被这个 1358px 画布撑开，
  // 退出全屏时量出来的容器宽仍是 1358，画布就按 1358 定型，宿主还把同一行的
  // 其他卡片挤变形（用户报过的"全屏放大再缩小后大小变了"）。收起 inline 宽度
  // 后容器宽只由布局决定；Chart 的 _resize 随后会用 forceStyle 重写 inline 尺寸。
  // 忽略传入的 (w,h)：新实例的 ResizeObserver 首次回调带的是创建时的旧尺寸，
  // 迟到会把刚放大的画布缩回去。
  function remeasureResize(chart, origResize) {
    var cv = chart.canvas;
    var prevW = cv && cv.style ? cv.style.width : '';
    if (cv && cv.style) cv.style.width = '0px';
    try { origResize(); }
    finally { if (cv && cv.style && cv.style.width === '0px') cv.style.width = prevW; }
  }

  /* ---------- 全屏：遮罩 + 居中面板 + 标题栏 ----------
     面板就是图表宿主本身（加 ds-chart-fullscreen 类，CSS 见 components.css），画布不搬家；
     进入时在宿主里临时插一条标题栏（标题取所在卡片的 .ds-card-title，没有卡片退回
     图表自己的 title 配置）、在 body 末尾临时挂一块遮罩，退出时两者都摘掉，宿主 DOM
     恢复原样。同一时刻只有一个全屏（遮罩盖住了其他图表的入口）。
     Esc 用 capture 阶段的 keydown：此时若有模态弹窗（全屏里打开的数据表）开着，
     让 Esc 先关弹窗、不退全屏。 */
  var fsState = null;

  function fsTitleOf(host, chart) {
    var card = host.closest ? host.closest('.ds-card') : null;
    var t = card && card.querySelector('.ds-card-title');
    var text = t && t.textContent.trim();
    if (text) return text;
    var cfgTitle = chart && chart.config && chart.config.options && chart.config.options.plugins &&
      chart.config.options.plugins.title && chart.config.options.plugins.title.text;
    return cfgTitle ? String(cfgTitle) : '图表';
  }

  // 摘掉全屏的临时 DOM 与监听（不 resize）；destroy() 也走这里。
  function fsTeardown(host) {
    host.classList.remove('ds-chart-fullscreen');
    var head = host.querySelector(':scope > .ds-fs-head');
    if (head) head.remove();
    if (fsState && fsState.host === host) {
      if (fsState.backdrop.parentNode) fsState.backdrop.parentNode.removeChild(fsState.backdrop);
      document.removeEventListener('keydown', fsState.onKey, true);
      fsState = null;
    }
  }

  // 全屏中滚轮一律按 zoom 处理（全屏视图里没有页面滚动冲突），不论图表自己的模式。
  function wheelModeOf(chart) {
    var host = chart.canvas && chart.canvas.parentNode;
    if (host && host.classList.contains('ds-chart-fullscreen')) return 'zoom';
    return chart.$ds.mode || options.wheel;
  }

  // 单个柱状数据集 + dsColorBy:'category'（数据集上的优先于 config 顶层的）
  function categoryColorWanted(config, d) {
    var flag = d.dsColorBy != null ? d.dsColorBy : config.dsColorBy;
    if (flag !== 'category') return false;
    return (config.data.datasets || []).length === 1;
  }

  DS.charts = {
    /* 给同目录的组件模块（waterfall.js / boxplot.js）共用的小工具；不是公开 API。 */
    _util: {
      cssVar: cssVar, hexToRgba: hexToRgba, fmtInt: fmtInt, zoomAxisFor: zoomAxisFor,
      AREA_FILL_ALPHA: AREA_FILL_ALPHA
    },

    /* 进/出全屏。on 省略 = 切换。⛶ 按钮、标题栏 ×、Esc、点遮罩都走这里。
       Bug 2（用户报过两次）的约束全部保留：先改 DOM/类、再同步 chart.resize()
       （resize 包装会忽略传入尺寸、测量前收起 inline 宽度），不经 setTimeout/rAF。 */
    fullscreen: function (chart, on) {
      if (!chart || !chart.canvas) return;
      var host = chart.canvas.parentNode;
      var is = host.classList.contains('ds-chart-fullscreen');
      if (on === undefined) on = !is;
      if (!!on === is) return;
      if (on) {
        if (fsState) {
          var other = fsState.host.querySelector('canvas');
          if (other && other._dsChart) DS.charts.fullscreen(other._dsChart, false); else fsTeardown(fsState.host);
        }
        var head = document.createElement('div');
        head.className = 'ds-fs-head';
        head.innerHTML = '<span class="ds-fs-title"></span>' +
          '<button type="button" class="ds-chart-btn" data-act="fs-close" title="关闭全屏（Esc）" aria-label="关闭全屏">×</button>';
        head.querySelector('.ds-fs-title').textContent = fsTitleOf(host, chart);
        head.querySelector('[data-act="fs-close"]').addEventListener('click', function () {
          DS.charts.fullscreen(chart, false);
        });
        host.insertBefore(head, host.firstChild);
        var backdrop = document.createElement('div');
        backdrop.className = 'ds-fs-backdrop';
        backdrop.addEventListener('click', function () { DS.charts.fullscreen(chart, false); });
        // 遮罩上的滚轮不能滚动背后的页面
        backdrop.addEventListener('wheel', function (ev) { ev.preventDefault(); }, { passive: false });
        document.body.appendChild(backdrop);
        var onKey = function (ev) {
          if (ev.key !== 'Escape') return;
          if (document.querySelector('.ds-modal-backdrop:not([hidden])')) return;
          DS.charts.fullscreen(chart, false);
        };
        document.addEventListener('keydown', onKey, true);
        fsState = { host: host, backdrop: backdrop, onKey: onKey };
        host.classList.add('ds-chart-fullscreen');
      } else {
        fsTeardown(host);
      }
      if (chart.$ds) DS.charts._syncHint(chart);
      chart.resize();
    },

    init: function (opts) {
      opts = opts || {};
      if (opts.wheel) options.wheel = opts.wheel;
      if (opts.maxLabel) options.maxLabel = opts.maxLabel;
      if (typeof Chart !== 'undefined') {
        Chart.defaults.font.family = cssVar('--font-sans') || 'sans-serif';
        Chart.defaults.font.size = 12;
        Chart.defaults.animation = false;  // 报表场景优先确定性，也让自动化测试可判定
      }
      document.addEventListener('ds:themechange', DS.charts.retheme);
    },

    options: function () { return options; },

    /* 渐进色板：第 i 个（共 n 个）色相 = i*360/n，S/L 读 --chart-ramp-s/-l；
       返回 n 个 hsla() 字符串，opts.alpha 默认 1。 */
    rampColors: rampColors,

    themeColors: function () {
      return {
        grid: cssVar('--chart-grid'),
        axis: cssVar('--chart-axis'),
        text: cssVar('--color-text-secondary'),
        series: ['--chart-s1', '--chart-s2', '--chart-s3',
                 '--chart-s4', '--chart-s5', '--chart-s6'].map(cssVar),
        // 扩展到 10 色（s1..s10）：桑基图的节点按"层序 + 层内序"顺次取色，
        // 三层 [3,4,3] 的图相邻两层合计 7 个节点，6 色序列在数学上不够。
        // 其余图表仍然只用上面的 6 色 series，行为不变。
        seriesExt: ['--chart-s1', '--chart-s2', '--chart-s3', '--chart-s4', '--chart-s5',
                    '--chart-s6', '--chart-s7', '--chart-s8', '--chart-s9', '--chart-s10'].map(cssVar)

    },

    /* 时间轴退而求其次的方案：内联的 src/vendor/chart.umd.js 是裸 Chart.js
       4.4.0，没有带 chartjs-adapter-date-fns 之类的日期适配器（Chart.js 的
       'time'/'timeseries' 轴类型本身依赖它才能解析/格式化时间），本仓库零
       外链、不联网下载第三方库，所以不内联适配器。这里退回到 'linear' 数值
       轴 + 自定义 ticks.callback，把时间戳（毫秒）格式化成日期标签，达到
       视觉等效——不是真正的 time scale（没有"按天/按周自动选刻度密度"这类
       能力，刻度密度仍由 Chart.js 对线性轴的默认算法决定），细节见 README
       「时间轴」一节。
       全部用 UTC 方法（getUTCMonth/getUTCDate/...）而不是本地时区的
       getMonth/getDate：渲染断言要在任何时区的机器上都算出同一个字符串，
       调用方用 Date.UTC() 生成时间戳时两边口径一致。 */

      function pad2(n) { return n < 10 ? '0' + n : String(n); }
      var wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      var fn = function (value) {
        var d = new Date(value);
        if (isNaN(d.getTime())) return String(value);
        if (fmt === 'ymd') {
          return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
        }
        return (d.getUTCMonth() + 1) + '/' + d.getUTCDate();
      };
      // 标记：paint() 看到某根轴的 ticks.callback 带这个标记，就知道这根轴
      // 是"用数值轴模拟的日期轴"，悬浮框标题要同步按日期显示（格式与刻度
      // 一致，后面加星期几）。fn.title(value) 单独暴露，方便调用方复用。
      fn.__dsDateTicks = true;
      fn.title = function (value) {
        var d = new Date(value);
        if (isNaN(d.getTime())) return String(value);

      return ds.every(function (d) { return !d.data || d.data.length === 0; });
    },

    /* ---------- 气泡图 ----------
       items: [{ name, count, value }] —— 一个条目一个气泡，x = count（数量），
       y = value（平均值）。bubbleData 做 B1/B2（纯函数，可单独用）：
         - 过滤 count < minCount（默认 5）或 value 非有限数的条目，
           按 count 降序取前 topN（默认 50）；
         - 半径 r = max(minRadius, sqrt(count / maxCount) * maxRadius)，默认 5 / 35
           —— 面积与数量成正比（不是半径成正比），最大的条目半径为 maxRadius。
       返回 { points: [{ x, y, r, name, count }], maxCount }。 */
    bubbleData: function (items, opts) {
      opts = opts || {};
      var minCount = opts.minCount != null ? opts.minCount : 5;
      var topN = opts.topN != null ? opts.topN : 50;
      var minR = opts.minRadius != null ? opts.minRadius : 5;
      var maxR = opts.maxRadius != null ? opts.maxRadius : 35;
      var kept = (items || []).filter(function (it) {
        return it && it.count >= minCount && isFinite(it.value);
      }).sort(function (a, b) { return b.count - a.count; }).slice(0, topN);
      var maxCount = kept.length ? kept[0].count : 1;
      return {
        maxCount: maxCount,
        points: kept.map(function (it) {
          return { x: it.count, y: it.value, r: Math.max(minR, Math.sqrt(it.count / maxCount) * maxR),
