<script>
// 测试钩子：?nostorage=1 模拟隐私模式 / file:// 下 localStorage 被禁用
if (new URLSearchParams(location.search).get('nostorage') === '1') {
  Object.defineProperty(window, 'localStorage', {
    configurable: true,
    get: function () { throw new DOMException('denied', 'SecurityError'); }
  });
}
</script>

#sankey-host:not(.ds-chart-fullscreen) { height: min(520px, calc(100vh - 120px)); }
/* demo：气泡图的气泡半径最大 35px，半宽卡片里要给 50 个气泡与标签避让留足高度 */
#bubble-host:not(.ds-chart-fullscreen) { height: 500px; }
